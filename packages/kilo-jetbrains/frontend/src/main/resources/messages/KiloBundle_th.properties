session.board.intro.more=เซสชันนี้และเอเจนต์ย่อยของงาน รวมทั้งที่ซ้อนกัน จะโพสต์สิ่งที่ค้นพบ คำถาม และอุปสรรคที่นี่ขณะทำงาน หากไม่มีกระดานนี้ คุณจะไม่เห็นข้อความเหล่านี้เลย เพราะเอเจนต์ย่อยแต่ละตัวมีบันทึกของตัวเอง ทุกคนบนกระดานอ่านทุกข้อความ รวมทั้งข้อความที่ส่งถึงคนอื่น ดังนั้นผู้รับจึงเป็นเพียงคำแนะการส่งต่อ ไม่ใช่ขอบเขตความเป็นส่วนตัว การโพสไม่เริ่ม ปลุก หรือขัดจังหวะเอเจนต์ และไม่แทนผลลัพท์ปกติของเอเจนต์ย่อย: <b>HOLD</b> และ <b>VETO</b> เป็นเพียงข้อเสนอแนะ ไม่ใช่กลไกควบคุม การรีเซ็ตจะลบข้อความด้านล่างสำหรับทุกคน โดยไม่หยุดเอเจนต์หรือเปลี่ยนบทสนทนา
