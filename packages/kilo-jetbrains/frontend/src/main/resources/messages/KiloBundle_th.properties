worktree.orphans.help.causes=โฟลเดอร์ที่เหลือค้างมักเกิดจากการลบที่ถูกขัดจังหวะ worktree ที่ถูกลบจากภายนอก Kilo หรือเครื่องมือที่เขียนข้อมูลลงในโฟลเดอร์หลังจากถูกลบไปแล้ว การลบที่ยังทำงานอยู่จะไม่แสดงที่นี่
worktree.orphans.help.delete=การลบจะเอาโฟลเดอร์ที่เลือกออกจากดิสก์อย่างถาวรโดยไม่ผ่านถังขยะ ไม่มีการแตะต้องสาขาหรือ worktree ที่ใช้งานอยู่ ขนาดคือพื้นที่ที่แต่ละโฟลเดอร์ใช้อยู่บนดิสก์ในขณะนี้
