worktree.orphans.help.intro=Kilo เก็บ worktree ทุกอันที่สร้างไว้ในโฟลเดอร์ .kilo/worktrees ของที่เก็บนี้ โฟลเดอร์ด้านล่างอยู่ในโฟลเดอร์นั้น แต่ git ไม่ได้ระบุว่าโฟลเดอร์ใดเป็น worktree จึงไม่มีอะไรใช้งานอยู่แล้ว
