# Commands settings (renamed from Workflows) + settings info banners
settings.info.showMore=显示更多
settings.info.showLess=收起
settings.info.learnMore=了解更多
settings.agentBehavior.agents.info=智能体是 Kilo 运行时所扮演的角色，每个角色都有自己的提示词、模型和工具权限。
settings.agentBehavior.agents.info.more=列表中显示内置智能体，以及来自本项目或全局 Kilo 配置的自定义智能体。主智能体是你在会话中选择使用的对象，子智能体只有在其他智能体通过任务工具委派时才会运行，而设置为“全部”的智能体两者都可以承担。编辑智能体会将其定义写入磁盘，因此更改会应用于每个新会话。内置智能体可以被覆盖但不能删除，隐藏某个智能体只会将其从选择器中移除。
settings.agentBehavior.mcp.info=MCP 服务器是独立的进程，为智能体提供额外的工具，例如问题跟踪器、数据库或浏览器。
settings.agentBehavior.mcp.info.more=本地服务器是 Kilo 在你的机器上启动并通过 stdio 通信的命令；远程服务器是 Kilo 连接的 HTTP 网址，有时需要你先登录。连接后，服务器工具会像内置工具一样呈现给智能体，并遵循相同的批准规则。在此处断开连接只会停止提供这些工具，而不会删除相关配置。要添加服务器，请让智能体帮你添加，它会将该条目写入你的 Kilo 配置中。
settings.agentBehavior.skills.info=技能是仅在当前任务与之匹配时智能体才会加载的指令包。
settings.agentBehavior.skills.info.more=每个技能都是一个附带简短描述的 SKILL.md 文件。Kilo 仅在上下文中保留该描述，并在智能体判断该技能适用时才读取完整内容，因此可以低成本地保留大量技能。技能来源包括本项目、你的全局 Kilo 配置，以及“附加技能来源”下列出的任何其他文件夹或网址。新增和修改的技能会在核心重新加载后生效，而这一过程会在会话运行期间推迟执行。
settings.agentBehavior.commands.displayName=命令
settings.agentBehavior.commands.info=命令是保存的提示词，你可以在聊天中输入 /name 来运行它们。此前它们被称为工作流。
settings.agentBehavior.commands.info.more=每个命令都是一个 Markdown 文件，其正文会作为你的提示词发送，因此非常适合用于诸如发起拉取请求或运行发布检查等可重复执行的任务。Kilo 会从本项目和你的全局 Kilo 配置中读取命令，并且仍会读取旧版 .kilo/workflows 文件夹中的文件。文件中的 front matter 可以为该命令固定指定智能体、模型或变体。内置命令可以打开查看，但不能编辑或删除，保存的更改会在核心重新加载后生效。
settings.agentBehavior.commands.search=筛选命令
settings.agentBehavior.commands.empty=未找到任何命令。
