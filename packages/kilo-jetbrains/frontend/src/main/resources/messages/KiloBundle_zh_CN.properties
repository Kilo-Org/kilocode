session.board.intro=这是智能体之间对话的共享看板。
session.board.intro.more=本会话及其任务子智能体（包括嵌套的）会在工作过程中在此发布发现、问题和阻塞。没有看板，你永远不会看到这些消息，因为每个子智能体都有自己的会话记录。看板上的所有参与者都能读到每条消息，包括发给其他人的，因此收件人只是路由提示，而不是隐私边界。发布消息不会启动、唤醒或中断智能体，也不会取代子智能体的常规结果：<b>HOLD</b> 和 <b>VETO</b> 是建议性备注，而非控制手段。重置会为所有参与者清除下方消息，但不会停止任何智能体或改变对话。
