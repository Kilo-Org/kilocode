worktree.orphans.help.intro=Kilo legt jeden Worktree, den es erstellt, im Ordner .kilo/worktrees dieses Repositorys ab. Die Ordner unten liegen in diesem Ordner, aber git führt keinen davon als Worktree, sie werden also nicht mehr verwendet.
worktree.orphans.help.checkout=Ein Ordner mit der Markierung "Enthält ein git-Checkout" hat noch einen .git-Eintrag und kann nicht committete Arbeit enthalten. Diese bleiben nicht ausgewählt, öffnen Sie den Ordner also und prüfen Sie ihn vor dem Löschen.
worktree.orphans.help.causes=Übrig gebliebene Ordner entstehen meist durch einen abgebrochenen Löschvorgang, einen außerhalb von Kilo entfernten Worktree oder ein Tool, das nach dem Entfernen in den Ordner geschrieben hat. Noch laufende Löschvorgänge werden hier nicht aufgeführt.
worktree.orphans.help.delete=Beim Löschen werden die ausgewählten Ordner endgültig von der Festplatte entfernt, ohne den Papierkorb. Kein Branch und kein aktiver Worktree wird angetastet. Die Größen entsprechen dem aktuellen Speicherbedarf jedes Ordners.
