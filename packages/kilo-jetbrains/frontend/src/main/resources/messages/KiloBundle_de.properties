session.board.intro=Dies ist die gemeinsame Pinnwand, über die Agenten miteinander sprechen.
session.board.intro.more=Diese Sitzung und ihre Aufgaben-Subagenten, auch verschachtelte, veröffentlichen hier Erkenntnisse, Fragen und Blocker während der Arbeit. Ohne die Pinnwand würden Sie diese Nachrichten nie sehen, denn jeder Subagent führt sein eigenes Transkript. Alle Beteiligten lesen jede Nachricht, auch die an andere gerichteten; ein Empfänger ist also ein Routing-Hinweis und keine Datenschutzgrenze. Ein Beitrag startet, weckt oder unterbricht niemals einen Agenten und ersetzt nicht das normale Ergebnis eines Subagenten: <b>HOLD</b> und <b>VETO</b> sind beratende Hinweise, keine Steuerbefehle. Das Zurücksetzen löscht die Nachrichten unten für alle Beteiligten, ohne einen Agenten zu stoppen oder eine Unterhaltung zu ändern.
