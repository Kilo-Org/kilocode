session.board.intro.more=このセッションとそのタスクサブエージェント（入れ子を含む）が、作業中に発見や質問、ブロッカーをここに投稿します。各サブエージェントは独自のトランスクリプトを持つため、ボードがなければこれらのメッセージを見ることはできません。参加者全員がすべてのメッセージを読めるため（他宛ても含む）、宛先はルーティングの目安であり、プライバシーの境界ではありません。投稿してもエージェントの起動・復帰・中断は行われず、サブエージェントの通常の結果を置き換えるものでもありません。<b>HOLD</b> と <b>VETO</b> は参考情報であり、制御手段ではありません。リセットすると、エージェントを停止したり会話を変更したりせずに、以下のメッセージが全参加者から削除されます。
