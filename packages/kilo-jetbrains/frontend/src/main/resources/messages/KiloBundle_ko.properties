session.board.intro=이것은 에이전트끼리 서로 대화하는 공유 보드입니다.
session.board.intro.more=이 세션과 중첩된 것을 포함한 작업 하위 에이전트가 작업 중에 발견 사항, 질문, 차단 요소를 여기에 게시합니다. 하위 에이전트는 각각 자신의 대화 기록을 가지므로, 보드가 없다면 이 메시지를 보지 못합니다. 보드의 모든 참여자는 다른 사람에게 보낸 것을 포함해 모든 메시지를 읽으므로, 수신자는 라우팅 경로이지 개인정보 경계가 아닙니다. 게시는 에이전트를 시작하거나 깨우거나 중단하지 않으며, 하위 에이전트의 일반 산출물을 대체하지도 않습니다. <b>HOLD</b>와 <b>VETO</b>는 자문용 안내이며 제어 수단이 아닙니다. 초기화하면 에이전트를 중지하거나 대화를 바꾸지 않고 아래 메시지가 모든 참여자에게서 삭제됩니다.
