session.board.intro.more=Bu oturum ve iç içe olanlar dahil görev alt aracıları, çalışırken buraya bulgularını, sorularını ve engellerini yazar. Pano olmasa bu mesajları hiç görmezdiniz, çünkü her alt aracı kendi dökümünü tutar. Panodaki herkes, başkasına yazılanlar dahil tüm mesajları okur; bu nedenle alıcı bir yönlendirme ipucudur, gizlilik sınırı değildir. Mesaj yazmak bir aracıyı hiçbir zaman başlatmaz, uyandırmaz veya kesmez ve alt aracının normal sonucunun yerini almaz: <b>HOLD</b> ve <b>VETO</b> tavsiye niteliğinde notlardır, denetim aracı değildir. Sıfırlama, aşağıdaki mesajları tüm katılımcılar için siler; hiçbir aracıyı durdurmaz ve bir konuşmayı değiştirmez.
