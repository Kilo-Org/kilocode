name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  bun-version:
    description: "Bun version to install instead of the root packageManager version"
    required: false
    default: ""
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # kilocode_change start - Defender real-time scanning slows every file write and process spawn on Windows.
    # Exclude the work, temp and Bun directories before the install. Best effort: without Defender, nothing changes.
    - name: Exclude work directories from Defender scanning
      if: runner.os == 'Windows'
      continue-on-error: true
      shell: pwsh
      run: |
        foreach ($dir in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\.bun")) {
          if (-not $dir) { continue }
          try { Add-MpPreference -ExclusionPath $dir -ErrorAction Stop; Write-Host "Defender exclusion: $dir" }
          catch { Write-Host "Defender exclusion failed for ${dir}: $($_.Exception.Message)" }
        }
    # kilocode_change end

    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # kilocode_change
      with:
        node-version: "24"

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V="${{ inputs.bun-version }}"
          if [ -z "$V" ]; then V=$(node -p "require('./package.json').packageManager.split('@')[1]"); fi
          TAG=$([ "$V" = "canary" ] && echo "canary" || echo "bun-v${V}")
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/${TAG}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ !steps.bun-url.outputs.url && inputs.bun-version || '' }}
        bun-version-file: ${{ !steps.bun-url.outputs.url && !inputs.bun-version && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: |
        echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        echo "version=$(bun --version)" >> "$GITHUB_OUTPUT"

    # On Windows, extracting the cache archive takes longer than Bun downloading and
    # extracting the same packages itself, so Windows installs skip the cache.
    - name: Restore Bun dependencies
      id: bun-cache
      if: runner.os != 'Windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # kilocode_change
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.cache.outputs.version }}-${{ hashFiles('bun.lock', 'patches/**') }}

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      run: bun install --frozen-lockfile ${{ inputs.install-flags }}
      shell: bash

    - name: Save Bun dependencies
      if: runner.os != 'Windows' && steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # kilocode_change
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
