# kilocode_change - new file: upstream deleted this composite action in v2.2.7, but Kilo's kilo-v2.yml still uses it
name: "Setup Git Committer"
description: "Create app token and configure git user"
inputs:
  opencode-app-id:
    description: "OpenCode GitHub App ID"
    required: true
  opencode-app-secret:
    description: "OpenCode GitHub App private key"
    required: true
  repositories:
    description: "Comma or newline-separated repository names the token may access; empty covers every repository of the installation"
    required: false
    default: ""
  permission-contents:
    description: "Contents permission for the token (read or write); empty, with no other permission input set, inherits every app permission"
    required: false
    default: ""
  permission-pull-requests:
    description: "Pull requests permission for the token (read or write)"
    required: false
    default: ""
  permission-workflows:
    description: "Workflows permission for the token (write)"
    required: false
    default: ""
outputs:
  token:
    description: "GitHub App token"
    value: ${{ steps.apptoken.outputs.token }}
  app-slug:
    description: "GitHub App slug"
    value: ${{ steps.apptoken.outputs.app-slug }}
runs:
  using: "composite"
  steps:
    - name: Create app token
      id: apptoken
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 # kilocode_change
      with:
        app-id: ${{ inputs.opencode-app-id }}
        private-key: ${{ inputs.opencode-app-secret }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.repositories }}
        permission-contents: ${{ inputs['permission-contents'] }}
        permission-pull-requests: ${{ inputs['permission-pull-requests'] }}
        permission-workflows: ${{ inputs['permission-workflows'] }}

    - name: Configure git user
      run: |
        slug="${{ steps.apptoken.outputs.app-slug }}"
        git config --global user.name "${slug}[bot]"
        git config --global user.email "${slug}[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
        keys="$(git config --local --name-only --get-regexp '^includeIf\.gitdir:' || true)"
        for key in $keys; do
          path="$(git config --local --get "$key" || true)"
          case "$path" in
            *git-credentials-*.config) git config --local --unset-all "$key" || true ;;
          esac
        done
      shell: bash

    # Serve the token from a credential helper outside the workspace instead of writing it into the origin URL in
    # .git/config.
    - name: Configure git credentials
      env:
        TOKEN: ${{ steps.apptoken.outputs.token }}
        REPO: ${{ github.repository }}
      run: |
        helper="${RUNNER_TEMP}/git-committer-credential-helper"
        (
          umask 077
          cat > "$helper" <<EOF
        #!/bin/sh
        cat > /dev/null
        test "\$1" = get || exit 0
        echo username=x-access-token
        echo password=${TOKEN}
        EOF
        )
        chmod 700 "$helper"
        git config --global --replace-all credential.https://github.com.helper ""
        git config --global --add credential.https://github.com.helper "$helper"
        git remote set-url origin "https://github.com/${REPO}"
      shell: bash
