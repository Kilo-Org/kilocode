name: kilo-v2

on:
  push:
    branches:
      - v2
  # Every pull request, so stacked PRs that target another v2 PR branch also run.
  # This file exists only on the v2 line, so PRs into main do not run it.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflows:
    name: workflow allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check workflow allowlist
        run: bun script/check-workflows.ts

  # Build the Kilo host (packages/kilo-cli) on one native runner per OS and keep the executables as workflow
  # artifacts. `bun run install:alpha` installs the darwin-arm64 one. The upstream CLI is not built here: it is
  # not what Kilo ships.
  # Artifacts only: no publishing and no secrets.
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            host: ubuntu-24.04
          - target: darwin-arm64
            host: macos-15
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build the Kilo host
        working-directory: packages/kilo-cli
        run: bun run script/build.ts --single --skip-install

      # Runs the executable in an isolated profile. The host must be the Kilo entry, not the upstream one: it names
      # itself `kilo2`, keeps its data in `kilo2` (not `opencode`) and starts the background service from itself.
      - name: Check the Kilo host
        run: bun script/kilocode/smoke-host.ts packages/kilo-cli/dist/cli-${{ matrix.target }}/bin/kilo2

      # A tarball keeps the executable bit, which a zipped artifact loses.
      - name: Archive CLI
        run: tar -czf kilo-v2-cli-${{ matrix.target }}.tar.gz -C packages/kilo-cli/dist cli-${{ matrix.target }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kilo-v2-cli-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The v1 line runs a curated macOS unit job because its darwin build ships. v2 runs unit tests on
  # Linux and Windows only, so this covers the platform-specific filesystem, PTY, process and shell
  # code on the OS that `install:alpha` uses.
  #
  # Like the v1 Darwin profile, it holds only files whose failure would point at macOS behavior:
  # file watching, node-pty, process spawning and shell selection. Platform-neutral suites stay on
  # Linux and Windows, where they already run, and cost about 3x more on the macOS runner.
  macos:
    name: macOS platform tests
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      # macOS ships Bash 3.2, but some upstream shell fixtures use process substitution and function
      # compound syntax that need Bash 5, which the Linux runners have. Install it and use it for the
      # tests so the darwin job exercises the same shell behavior as Linux.
      - name: Setup Bash 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "SHELL=$(brew --prefix)/bin/bash" >> "$GITHUB_ENV"

      # PowerShell's first start on macOS loads the .NET runtime and assemblies. The shell scanner tests
      # run several pwsh invocations under a five second budget per case, and the first one paid that
      # cold start on a loaded runner. Warm the runtime so those cases see steady state.
      - name: Warm PowerShell
        run: pwsh -NoProfile -Command exit

      # Through each package's own test script, like the Linux and Windows unit jobs: core's wrapper
      # gives the run a temporary HOME, OPENCODE_TEST_HOME, XDG directories and TMPDIR.
      - name: Run core platform tests
        working-directory: packages/core
        run: bun run test ./test/filesystem ./test/pty/pty-session.test.ts ./test/persistent-pty-daemon.test.ts ./test/process/process.test.ts ./test/tool-shell.test.ts ./test/session-shell.test.ts ./test/shell.test.ts ./test/shell-cleanup.test.ts ./test/util/which.test.ts

      # The v1 darwin profile covered the PTY HTTP routes here. On v2 the PTY transport, socket and
      # persistent daemon live in packages/server, so run those files instead.
      - name: Run server PTY tests
        working-directory: packages/server
        run: bun run test ./test/pty-socket.test.ts ./test/pty-transport.test.ts ./test/persistent-pty.test.ts ./test/process.test.ts

  shared:
    name: shared upstream patches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checks compare with the pinned upstream release commit, which they find in the history.
          # A blobless clone has all commits and trees, and fetches only the blobs that the diff reads.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check kilocode_change markers in shared upstream files
        run: bun script/check-opencode-annotations.ts

      - name: Count shared upstream patches
        run: bun script/check-shared-patches.ts

  # The generated map files change with every merge, so parallel PRs that commit them always conflict and go stale.
  # PRs change only the inputs (code, done-proofs, features.json, dispositions.json); this job validates them.
  # `progress-commit` regenerates the map on v2 and commits it.
  progress:
    name: migration progress map
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Fetch the pinned v1 target
        # The map measures the v1 delta from `main`, which the v2 checkout does not contain.
        run: git fetch --filter=blob:none --no-tags origin main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Check that the PR does not commit generated map files
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD -- $(bun script/upstream/progress.ts --outputs))
          if [ -n "$files" ]; then
            echo "::error::Do not commit generated progress map files. CI regenerates them on v2. Restore them with: git checkout origin/v2 -- $(echo $files)"
            exit 1
          fi

      - name: Validate the map inputs
        run: bun script/upstream/progress.ts

  # The only job with write access. It runs on pushes to v2, never on pull requests.
  progress-commit:
    name: migration progress map commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    needs: progress
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch the pinned v1 target
        run: git fetch --filter=blob:none --no-tags origin main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Commit the regenerated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=$(bun script/upstream/progress.ts --outputs)
          # Each attempt regenerates on the current v2 tip, so a newer push cannot leave a stale map or a conflict.
          for attempt in 1 2 3; do
            git fetch origin v2
            git reset --hard origin/v2
            bun script/upstream/progress.ts
            if git diff --quiet -- $paths; then exit 0; fi
            git commit -m "chore(progress): regenerate the map" -- $paths
            git push origin HEAD:v2 && exit 0
          done
          exit 1

  progress-comment:
    name: migration progress comment
    # Same-repository pull requests only: a fork PR gets a read-only token and cannot comment.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Fetch the pinned v1 target
        run: git fetch --filter=blob:none --no-tags origin main

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Compare the progress map with the base branch
        env:
          REPO: ${{ github.repository }}
        run: |
          # Both maps are generated here, because PRs do not commit the map and a base branch can carry a stale one.
          git worktree add --detach ../base HEAD^1
          bun ../base/script/upstream/progress.ts
          cp ../base/migration-tracking/progress/progress.json base.json
          bun script/upstream/progress.ts
          git diff -U0 --no-color HEAD^1 HEAD > pr.diff
          {
            echo '<!-- migration-progress -->'
            bun script/upstream/progress.ts --compare base.json migration-tracking/progress/progress.json pr.diff
            echo
            echo "[Map on v2](https://github.com/$REPO/blob/v2/migration-tracking/progress/README.md) · [how cells close](https://github.com/$REPO/blob/v2/.kilo/skills/v2-migration/SKILL.md#progress-map)"
          } > body.md

      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '[.[] | select(.body | startswith("<!-- migration-progress -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -F body=@body.md > /dev/null
          fi

  upstream-tooling:
    name: upstream sync tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: script/upstream
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # placement.ts compares with the pinned upstream release commit, which it finds in the history.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Fails when a logic package (packages/kilo-*-core) imports @opencode/*; prints the core-internal imports of adapters.
      - name: Check the Kilo import rule
        run: bun placement.ts --imports

  kilo-packages:
    name: kilo packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Turborepo runs only the package tests that turbo.json lists. The Kilo packages run here instead, so
      # adding one needs no shared upstream patch. `@kilocode/gateway-core` stays in turbo.json.
      - name: Test the Kilo plugin
        working-directory: packages/kilo-plugin
        run: bun test

      - name: Test the Kilo host
        working-directory: packages/kilo-cli
        run: bun test

      - name: Typecheck the VS Code extension
        working-directory: packages/kilo-vscode
        run: bun run typecheck

      - name: Lint the VS Code extension
        working-directory: packages/kilo-vscode
        run: bun run lint

      - name: Test the VS Code extension
        working-directory: packages/kilo-vscode
        run: bun test

      # Fails when Kilo plugin activation grows past packages/kilo-cli/startup-budget.json (#15244).
      - name: Startup ratchet
        working-directory: packages/kilo-cli
        timeout-minutes: 2
        run: bun run startup
      - name: Test the sharded test runner
        working-directory: script/kilocode/test
        run: bun test
