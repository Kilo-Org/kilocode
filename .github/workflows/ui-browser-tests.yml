# kilocode_change - new file
name: UI browser tests

on:
  pull_request:
    branches: [main]
    paths:
      - packages/kilo-ui/**
      - packages/ui/**
      - packages/util/**
      - packages/sdk/js/**
      - packages/kilo-vscode/webview-ui/**
      - packages/kilo-vscode/.storybook/**
      - packages/kilo-vscode/tests/*.spec.ts
      - packages/kilo-vscode/playwright.config.ts
      - packages/kilo-vscode/package.json
      - .github/actions/setup-bun/**
      - .github/workflows/ui-browser-tests.yml

permissions:
  contents: read

jobs:
  browser:
    name: Browser behavior (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [kilo-ui, kilo-vscode]
    runs-on: ${{ github.repository == 'Kilo-Org/kilocode' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Check browser behavior and accessibility
        run: |
          # Screenshot comparisons are manual on v1. Keep running the interaction and accessibility specs.
          mapfile -t specs < <(find tests -name '*.spec.ts' ! -name 'visual-regression.spec.ts' ! -name 'permission-dock-dropdown.spec.ts' | sort)
          test "${#specs[@]}" -gt 0
          bunx playwright test --workers=4 "${specs[@]}"
