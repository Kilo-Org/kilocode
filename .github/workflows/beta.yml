name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # kilocode_change
        with:
          persist-credentials: true # kilocode_change - script/beta.ts fetches and pushes with the job token
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # kilocode_change start - commit, push and comment with the job token, not the maintainer app
      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # kilocode_change end

      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ github.token }} # kilocode_change
        run: bun script/beta.ts
