# kilocode_change - new file
name: Outdated Kilo dependencies

# Dependabot's root `bun` scan has version updates turned off (it mostly
# touched upstream files), so nothing else says when a Kilo-owned package falls
# behind. Once a month, list what `bun outdated` finds for packages/kilo-*
# (kilo-docs and kilo-jetbrains keep their own Dependabot blocks) and post a
# short summary to Slack. Read-only: it never opens a PR.

on:
  schedule:
    - cron: "23 9 1 * *" # 1st of the month, offset to avoid the top of the hour
  workflow_dispatch:

concurrency:
  group: outdated-kilo-deps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    # The Slack webhook comes from the STS bundle of ci-kilocode-notify, which needs environment
    # automation (the STS policy accepts only this file at refs/heads/main) and id-token: write. The
    # job therefore installs no packages and runs only this repository's code: read
    # .github/actions/kilo-credentials/README.md before adding a step.
    environment: automation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          install: false

      - id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p .cache
          bun --no-install script/kilocode/outdated.ts > .cache/report.json
          echo "count=$(jq -r .count .cache/report.json)" >> "$GITHUB_OUTPUT"
          jq -r '.full' .cache/report.json >> "$GITHUB_STEP_SUMMARY"
          # Build real JSON via jq instead of splicing text into a YAML payload.
          jq '{text}' .cache/report.json > .cache/slack-payload.json

      - if: steps.report.outputs.count != '0'
        name: Read the STS bundle
        id: creds
        uses: ./.github/actions/kilo-credentials
        with:
          workload: ci-kilocode-notify
          secrets: KILOCODE_SECURITY_ALERTS_SLACK_WEBHOOK

      - if: steps.report.outputs.count != '0'
        name: Notify Slack
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ steps.creds.outputs.KILOCODE_SECURITY_ALERTS_SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-file-path: .cache/slack-payload.json
