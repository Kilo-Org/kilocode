# kilocode_change - new file
name: Stale bot PR notify

# Bot-opened PRs (Dependabot, Security Agent, etc.) can sit unreviewed until
# stale (a real security PR went 13 days with green CI and zero reviews), or
# get reviewed and approved but never merge because a required check keeps
# failing -- dependabot-auto-merge.yml only arms auto-merge once and never
# checks back, so nothing else would ever catch that case. Once a day, flag
# any open bot PR that's conflicting, has a failing required check, or has
# sat unreviewed too long.

on:
  schedule:
    - cron: "0 13 * * *" # once a day
  workflow_dispatch:

concurrency:
  group: stale-bot-pr-notify
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STALE_DAYS: ${{ vars.STALE_BOT_PR_DAYS || '3' }}
        run: |
          prs=$(gh pr list --repo "$REPO" --search "is:open is:pr" \
            --json number,author,title,url,createdAt --limit 100)
          now=$(date -u +%s)

          # mergeStateStatus, reviews, and statusCheckRollup are fetched per
          # bot PR individually, not in the bulk list above: with 150+ PRs
          # open on this repo, mergeStateStatus alone is expensive enough
          # that requesting it for 100 PRs in one query reliably 502s.
          mkdir -p .cache
          : > .cache/flagged.ndjson
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            number=$(echo "$pr" | jq -r '.number')
            if ! detail=$(gh pr view "$number" --repo "$REPO" --json mergeStateStatus,reviews,statusCheckRollup); then
              echo "::warning::could not fetch detail for PR #$number, skipping"
              continue
            fi
            jq -cn --argjson now "$now" --argjson staleDays "$STALE_DAYS" --argjson pr "$pr" --argjson detail "$detail" '
              $pr + $detail
              | (($now - (.createdAt | fromdateiso8601)) / 86400) as $age
              | ((.statusCheckRollup // []) | any(.conclusion == "FAILURE")) as $ciFailing
              | . + {
                  age_days: ($age | floor),
                  reason: (
                    if .mergeStateStatus == "DIRTY" then "conflicting"
                    elif $ciFailing then "CI failing"
                    elif ((.reviews | length) == 0 and $age >= $staleDays) then "unreviewed"
                    else empty
                    end
                  )
                }
              | select(.reason != null)
            ' >> .cache/flagged.ndjson
          done < <(echo "$prs" | jq -c 'map(select(.author.is_bot == true)) | .[]')

          flagged=$(jq -c -s '.' .cache/flagged.ndjson)
          echo "flagged=$flagged" >> "$GITHUB_OUTPUT"

          # Build real JSON via jq instead of splicing PR titles (free text)
          # into a YAML payload through `${{ }}`.
          echo "$flagged" | jq '
            if length == 0 then {text: ""} else
              {text: (["*Bot PRs needing attention:*"] + map(
                "- <" + .url + "|#" + (.number | tostring) + " " + .title + "> ("
                + .author.login + ", " + (.age_days | tostring) + "d old, " + .reason + ")"
              )) | join("\n")}
            end
          ' > .cache/slack-payload.json

      - if: steps.build.outputs.flagged != '[]'
        name: Notify Slack
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SECURITY_ALERTS_SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-file-path: .cache/slack-payload.json
