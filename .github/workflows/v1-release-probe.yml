# kilocode_change - new file
name: V1 release runner probe

on:
  push:
    branches: [v1-release-readiness]

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    name: Probe ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        label: [ubuntu-24.04, windows-11-arm]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read release PR metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/16572/files" --jq 'length'
