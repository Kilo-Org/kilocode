# Tracks the newest upstream release and, once per tag, announces it in Slack and asks the sync
# endpoint to pull it in.
#
# Two independent per-tag cache markers keep the two halves of the handling separate, so each half
# runs again on a later scheduled run until it is done and is not repeated after it succeeded:
#   `last-seen-<tag>`  the tag's sync request completed, or the sync is not configured
#   `notified-<tag>`   the tag was already announced in Slack
# A marker is written only when its own step completed, so a run that did not finish one half
# leaves that half open for the next run.
#
# Setup: repo secrets `OPENCODE_WATCH_SYNC_URL` and `OPENCODE_WATCH_SYNC_SECRET` (both enable the
# sync; when either is unset no request is made and the tag is still recorded) and
# `OPENCODE_WATCH_VERCEL_SECRET` (optional Vercel protection bypass for the sync URL).
# kilocode_change start
# The Slack webhook (`KILOCODE_OPENCODE_WATCH_SLACK_WEBHOOK`) comes from the STS bundle of
# ci-kilocode-opencode-watch, which needs environment automation (the STS policy accepts only this
# file at refs/heads/main) and id-token: write, so the job runs only pinned actions, this
# repository's kilo-credentials action, gh, jq and curl: read
# .github/actions/kilo-credentials/README.md before adding a step.
# kilocode_change end

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 min at :07 and :37
  workflow_dispatch:

concurrency:
  group: opencode-release-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    if: vars.OPENCODE_WATCH_ENABLED != 'false' && (github.event_name == 'workflow_dispatch' || github.repository == 'Kilo-Org/kilocode') # kilocode_change
    runs-on: ${{ github.repository == 'Kilo-Org/kilocode' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }} # kilocode_change
    timeout-minutes: 5
    # kilocode_change start
    environment: automation
    permissions:
      contents: read
      id-token: write
    # kilocode_change end
    steps:
      # kilocode_change start - before the cache restores: a checkout empties the workspace
      - name: Checkout the kilo-credentials action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/kilo-credentials
      # kilocode_change end

      - id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data=$(gh release view --repo anomalyco/opencode --json tagName,name,url 2>/dev/null || echo '{}')
          tag=$(echo "$data" | jq -r '.tagName // empty')
          [ -z "$tag" ] && { echo "tag=" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$data" | jq -r '.name // .tagName')" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$data" | jq -r '.url')" >> "$GITHUB_OUTPUT"

      - if: steps.fetch.outputs.tag != ''
        id: sync-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 # kilocode_change
        with:
          path: .cache/last-seen
          key: last-seen-${{ steps.fetch.outputs.tag }}
          restore-keys: last-seen-

      - if: steps.fetch.outputs.tag != ''
        id: notify-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 # kilocode_change
        with:
          path: .cache/notified
          key: notified-${{ steps.fetch.outputs.tag }}

      - if: steps.fetch.outputs.tag != '' && steps.sync-cache.outputs.cache-hit != 'true'
        id: sync
        name: Trigger opencode sync
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
          URL: ${{ secrets.OPENCODE_WATCH_SYNC_URL }}
          SECRET: ${{ secrets.OPENCODE_WATCH_SYNC_SECRET }}
          VERCEL: ${{ secrets.OPENCODE_WATCH_VERCEL_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::warning::The OpenCode sync is not configured, so no request was made for $TAG"
            echo "handled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          headers=(-H "x-sync-secret: $SECRET" -H "Content-Type: application/json")
          if [ -n "$VERCEL" ]; then headers+=(-H "x-vercel-protection-bypass: $VERCEL"); fi
          curl -sfS --max-time 30 -X POST "$URL" "${headers[@]}" -d '{}'
          echo "handled=true" >> "$GITHUB_OUTPUT"

      - if: steps.sync.outputs.handled == 'true'
        name: Mark release as synced
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: mkdir -p .cache/last-seen && printf '%s\n' "$TAG" > .cache/last-seen/tag.txt

      - if: steps.sync.outputs.handled == 'true'
        name: Save synced-tag cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 # kilocode_change
        with:
          path: .cache/last-seen
          key: last-seen-${{ steps.fetch.outputs.tag }}

      # kilocode_change start
      # The release fields go through jq into a file, never into YAML or a script.
      - if: ${{ !cancelled() && steps.fetch.outputs.tag != '' && steps.notify-cache.outputs.cache-hit != 'true' }}
        name: Write the Slack payload
        env:
          NAME: ${{ steps.fetch.outputs.name }}
          TAG: ${{ steps.fetch.outputs.tag }}
          URL: ${{ steps.fetch.outputs.url }}
        run: |
          jq -n --arg name "$NAME" --arg tag "$TAG" --arg url "$URL" '{name: $name, tag: $tag, url: $url}' > "$RUNNER_TEMP/opencode-release.json"

      - if: ${{ !cancelled() && steps.fetch.outputs.tag != '' && steps.notify-cache.outputs.cache-hit != 'true' }}
        name: Read the STS bundle
        id: creds
        uses: ./.github/actions/kilo-credentials
        with:
          workload: ci-kilocode-opencode-watch
          secrets: KILOCODE_OPENCODE_WATCH_SLACK_WEBHOOK
      # kilocode_change end

      - if: ${{ !cancelled() && steps.fetch.outputs.tag != '' && steps.notify-cache.outputs.cache-hit != 'true' }}
        id: notify
        name: Notify Slack
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0 # kilocode_change
        with:
          webhook: ${{ steps.creds.outputs.KILOCODE_OPENCODE_WATCH_SLACK_WEBHOOK }} # kilocode_change
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/opencode-release.json # kilocode_change

      - if: ${{ !cancelled() && steps.notify.outcome == 'success' }}
        name: Mark release as notified
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: mkdir -p .cache/notified && printf '%s\n' "$TAG" > .cache/notified/tag.txt

      - if: ${{ !cancelled() && steps.notify.outcome == 'success' }}
        name: Save notified-tag cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 # kilocode_change
        with:
          path: .cache/notified
          key: notified-${{ steps.fetch.outputs.tag }}
