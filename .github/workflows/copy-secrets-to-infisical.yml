# kilocode_change - new file
name: "One-shot: copy secrets to Infisical (delete after use)"

# ONE-SHOT. Copies nine GitHub Actions secrets into Infisical EU (project kilo,
# environment production) at the /ci/ci-kilocode-* paths that the STS policies
# of the same names serve. Delete this file after the one successful run.
#
# - Auth: GitHub OIDC token -> Infisical OIDC Auth on a temporary machine
#   identity. Its role can only create these names on these exact paths: no
#   read, list, edit or delete. No Infisical credential is stored in GitHub.
# - Create-only: one POST /api/v4/secrets/<name> per target, no retry. A name
#   that already exists stops the run; nothing is updated or overwritten.
# - No value is printed, passed on a command line, or written to disk.
# - Verification: the v4 create response returns the value Infisical encrypted
#   and stored in that request (not a read-back). The job compares it with the
#   submitted value in memory and logs, per target, only
#   `KC_COPY_VERIFY <path> <name> match=true`. A returned value that differs
#   or is absent fails the run.
# - The token revoke is attempted at exit; the job fails unless a 401 "token
#   has been revoked" follows.
# - A partial run is reconciled by hand (see the PR); input `only` copies just
#   the remaining targets, with a new identity.
# - mode probe-login (after the identity is deleted): a job with no secrets
#   mints the same OIDC token, tries the Infisical login once, writes nothing,
#   and passes only on HTTP 404 "OIDC auth method not found for identity",
#   which proves that no OIDC Auth exists for this identity id. Any other
#   answer fails, including 401/403, which a live identity returns on a claim
#   mismatch. A successful login fails the job (the token is revoked at once).
#   The deletion itself is proven by Infisical's audit row for the identity.
# - Both jobs run only for dispatches by iscekic, and print identity_id so the
#   probe run can be matched to the copy run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "copy: create the secrets. probe-login: after the identity is deleted, prove Infisical refuses its login"
        required: true
        type: choice
        options:
          - copy
          - probe-login
      identity_id:
        description: Infisical machine identity ID (temporary, OIDC Auth only)
        required: true
        type: string
      only:
        description: "mode copy, optional: comma list of <path>:<name> targets to copy (default: all 10)"
        required: false
        type: string

concurrency:
  group: copy-secrets-to-infisical
  cancel-in-progress: false

permissions: {}

jobs:
  copy:
    if: github.repository == 'Kilo-Org/kilocode' && github.ref == 'refs/heads/main' && github.triggering_actor == 'iscekic' && inputs.mode == 'copy'
    # GitHub-hosted, so the OIDC claim runner_environment is github-hosted.
    runs-on: ubuntu-24.04
    # Above the worst case (240 s create deadline + 15 s request + revoke), so
    # the EXIT trap always reaches the revoke.
    timeout-minutes: 10
    environment: copy-secrets
    permissions:
      id-token: write
    steps:
      - name: Copy secrets (create-only)
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IDENTITY_ID: ${{ inputs.identity_id }}
          ONLY: ${{ inputs.only }}
          V_JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          V_JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          V_JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          V_JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          V_SECURITY_ALERTS_SLACK_WEBHOOK: ${{ secrets.SECURITY_ALERTS_SLACK_WEBHOOK }}
          V_V2_SYNC_SLACK_WEBHOOK: ${{ secrets.V2_SYNC_SLACK_WEBHOOK }}
          V_COMMUNITY_TRIAGE_SLACK_TOKEN: ${{ secrets.COMMUNITY_TRIAGE_SLACK_TOKEN }}
          V_COMMUNITY_TRIAGE_SLACK_WEBHOOK: ${{ secrets.COMMUNITY_TRIAGE_SLACK_WEBHOOK }}
          V_OPENCODE_WATCH_SLACK_WEBHOOK: ${{ secrets.OPENCODE_WATCH_SLACK_WEBHOOK }}
        run: |
          set +x
          umask 077
          readonly ORIGIN=https://eu.infisical.com
          readonly PROJECT_ID=8cf601df-1c5a-4c8f-9e21-7e9af6728b06
          readonly ENVIRONMENT=production
          readonly AUDIENCE=urn:kilocode:copy-secrets-to-infisical
          # The token lives 300 s and each request at most 15 s: no create starts
          # after this, so the EXIT trap always revokes inside the token's life.
          readonly CREATE_DEADLINE_S=240
          readonly MAX_BYTES=65536
          # <variable holding the value> <Infisical path> <Infisical name>
          readonly ALL_ROWS=(
            "V_JETBRAINS_MARKETPLACE_TOKEN /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_MARKETPLACE_TOKEN"
            "V_JETBRAINS_PRIVATE_KEY /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_PRIVATE_KEY"
            "V_JETBRAINS_PRIVATE_KEY_PASSWORD /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_PRIVATE_KEY_PASSWORD"
            "V_JETBRAINS_CERTIFICATE_CHAIN /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_CERTIFICATE_CHAIN"
            "V_SECURITY_ALERTS_SLACK_WEBHOOK /ci/ci-kilocode-scan-notify KILOCODE_SECURITY_ALERTS_SLACK_WEBHOOK"
            "V_SECURITY_ALERTS_SLACK_WEBHOOK /ci/ci-kilocode-notify KILOCODE_SECURITY_ALERTS_SLACK_WEBHOOK"
            "V_V2_SYNC_SLACK_WEBHOOK /ci/ci-kilocode-notify KILOCODE_V2_SYNC_SLACK_WEBHOOK"
            "V_COMMUNITY_TRIAGE_SLACK_TOKEN /ci/ci-kilocode-community KILOCODE_COMMUNITY_TRIAGE_SLACK_TOKEN"
            "V_COMMUNITY_TRIAGE_SLACK_WEBHOOK /ci/ci-kilocode-community KILOCODE_COMMUNITY_TRIAGE_SLACK_WEBHOOK"
            "V_OPENCODE_WATCH_SLACK_WEBHOOK /ci/ci-kilocode-opencode-watch KILOCODE_OPENCODE_WATCH_SLACK_WEBHOOK"
          )
          # Values reach jq through $ENV and iconv through a pipe from the printf
          # builtin, never through argv or a file. Tokens reach curl through a
          # --config process substitution. Response bodies stay in shell
          # variables; only names, statuses and booleans are printed.

          fail() {
            echo "::error::$1"
            exit 1
          }
          auth() { printf 'header = "Authorization: Bearer %s"\n' "$token"; }

          token=
          revoke() {
            local rc=$? rs pr ps category revoked=false
            [[ -n $token ]] || return 0
            rs=$(printf '%s' "$token" | jq -Rc '{accessToken: .}' |
              curl -sS -o /dev/null -w '%{http_code}' --proto =https --connect-timeout 5 --max-time 15 \
                -H 'Content-Type: application/json' --data-binary @- "$ORIGIN/api/v1/auth/token/revoke") || rs=000
            # The token allows one use per target plus this request: if the
            # revoke failed, this request is still authenticated and gets 403.
            # The 401 message gives the category (letters only): revoked,
            # usage_limit, expired or other.
            pr=$(curl -sS -w '\n%{http_code}' --proto =https --connect-timeout 5 --max-time 15 -K <(auth) \
              "$ORIGIN/api/v4/secrets?projectId=$PROJECT_ID&environment=$ENVIRONMENT&secretPath=/ci/ci-kilocode-notify&viewSecretValue=false") || pr=$'\n000'
            token=
            ps=${pr##*$'\n'}
            category=$(printf '%s' "${pr%$'\n'*}" | jq -r '(.message // "") | tostring |
              if test("has been revoked") then "revoked" elif test("usage limit") then "usage_limit"
              elif test("max age|max TTL|expired") then "expired" else "other" end' 2>/dev/null) || category=other
            pr=
            [[ $ps == 401 ]] || category=none
            [[ $ps != 401 || $category != revoked ]] || revoked=true
            echo "access token: revoke=HTTP $rs, request after revoke=HTTP $ps, revoked=$revoked category=${category//[^a-z_]/}"
            if [[ $revoked != true && $rc == 0 ]]; then
              echo "::error::the access token was not shown to be revoked"
              exit 1
            fi
          }
          trap revoke EXIT

          # ---- inputs ----
          [[ $IDENTITY_ID =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
            fail "identity_id is not a lowercase UUID"
          echo "identity_id=$IDENTITY_ID"
          selected=()
          if [[ -z $ONLY ]]; then
            selected=("${ALL_ROWS[@]}")
          else
            [[ $ONLY =~ ^[A-Za-z0-9_/:-]+(,[A-Za-z0-9_/:-]+)*$ ]] || fail "only must be a comma list of <path>:<name>"
            IFS=, read -r -a wanted <<<"$ONLY"
            for w in "${wanted[@]}"; do
              hits=0
              for row in "${ALL_ROWS[@]}"; do
                read -r _ p n <<<"$row"
                [[ "$p:$n" != "$w" ]] || hits=$((hits + 1))
              done
              [[ $hits == 1 ]] || fail "only: $w is not one of the 10 targets"
            done
            [[ -z $(printf '%s\n' "${wanted[@]}" | sort | uniq -d) ]] || fail "only: a target is listed twice"
            for row in "${ALL_ROWS[@]}"; do
              read -r _ p n <<<"$row"
              for w in "${wanted[@]}"; do
                [[ "$p:$n" != "$w" ]] || selected+=("$row")
              done
            done
          fi
          readonly ROWS=("${selected[@]}")
          echo "targets=${#ROWS[@]} only=${ONLY:-all}"

          # ---- every selected value, before any network call ----
          # Infisical trims the value on create (JavaScript String.trim, then
          # one trailing LF is kept if there was one) and expands ${...}
          # references on read. Such a value is refused, so Infisical stores and
          # serves exactly the GitHub secret.
          bad=0
          for row in "${ROWS[@]}"; do
            read -r var path name <<<"$row"
            value_ok=true
            reason=
            bytes=$(LC_ALL=C; v=${!var}; echo "${#v}")
            if [[ $bytes == 0 ]]; then
              reason=missing
            elif [[ $bytes -gt $MAX_BYTES ]]; then
              reason=too_large
            elif ! printf '%s' "${!var}" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1; then
              reason=not_utf8
            elif [[ ${!var} == *\$\{* ]]; then
              reason=reference_syntax
            elif [[ $(jq -n --arg k "$var" '
              def ws: "[\t\n\u000b\f\r \u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]+";
              def trimjs: sub("^" + ws; "") | sub(ws + "$"; "");
              $ENV[$k] as $v | ($v | if endswith("\n") then (trimjs + "\n") else trimjs end) == $v') != true ]]; then
              reason=would_be_trimmed
            fi
            if [[ -n $reason ]]; then
              value_ok=false
              bad=1
            fi
            echo "check $name $path value_ok=$value_ok${reason:+ reason=$reason}"
          done
          [[ $bad == 0 ]] || fail "refused before any write; nothing was sent to Infisical"

          # ---- GitHub OIDC token -> Infisical access token ----
          aud=$(jq -rn --arg a "$AUDIENCE" '$a | @uri')
          jwt=$(curl -sS --fail --proto =https --connect-timeout 5 --max-time 15 \
            -K <(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | jq -r '.value // empty') || fail "GitHub OIDC token request failed"
          [[ -n $jwt ]] || fail "GitHub OIDC token request returned no token"
          login_at=$SECONDS # before the login, so the deadline errs early
          login=$(printf '%s' "$jwt" | jq -Rc --arg id "$IDENTITY_ID" '{identityId: $id, jwt: .}' |
            curl -sS --proto =https --connect-timeout 5 --max-time 15 -H 'Content-Type: application/json' --data-binary @- \
              -w '\n%{http_code}' "$ORIGIN/api/v1/auth/oidc-auth/login") || login=$'\n000'
          jwt=
          status=${login##*$'\n'}
          token=$(printf '%s' "${login%$'\n'*}" | jq -r '.accessToken // empty' 2>/dev/null) || token=
          ttl=$(printf '%s' "${login%$'\n'*}" | jq -r '.expiresIn // "unknown"' 2>/dev/null) || ttl=unknown
          login=
          [[ $status == 200 && -n $token ]] || fail "Infisical OIDC login refused: HTTP $status; nothing was written"
          echo "Infisical login: HTTP 200, expiresIn=${ttl//[^a-z0-9]/}"
          # The deadline and the job timeout assume the identity's 300 s token.
          [[ $ttl == 300 ]] || fail "access token expiresIn is not 300; check the identity's TTL; nothing was written"

          # ---- one create per target; stop at the first failure ----
          not_attempted() {
            local rest
            for rest in "${ROWS[@]:$1}"; do
              read -r _ rpath rname <<<"$rest"
              echo "$rname $rpath created=no reason=not_attempted"
            done
          }
          done_rows=0
          for row in "${ROWS[@]}"; do
            read -r var path name <<<"$row"
            if ((SECONDS - login_at >= CREATE_DEADLINE_S)); then
              not_attempted "$done_rows"
              fail "create deadline (${CREATE_DEADLINE_S}s after login) reached after $done_rows of ${#ROWS[@]} created; reconcile before any other action"
            fi
            resp=$(jq -nc --arg k "$var" --arg p "$path" --arg proj "$PROJECT_ID" --arg env "$ENVIRONMENT" \
              '{projectId: $proj, environment: $env, secretPath: $p, type: "shared", secretValue: $ENV[$k]}' |
              curl -sS --proto =https --connect-timeout 5 --max-time 15 -K <(auth) -H 'Content-Type: application/json' \
                --data-binary @- -w '\n%{http_code}' "$ORIGIN/api/v4/secrets/$name") || resp=$'\n000'
            status=${resp##*$'\n'}
            if [[ $status == 200 ]]; then
              # key, version 1, environment, type; then the echo. The response has
              # no secretPath: the role allows create only on the exact path.
              checks=$(printf '%s' "${resp%$'\n'*}" | jq -r --arg k "$var" --arg n "$name" --arg env "$ENVIRONMENT" '
                if (.secret | type) != "object" then (if has("approval") then "approval" else "unexpected" end)
                else .secret | [
                  (.secretKey == $n), (.version == 1), (.environment == $env), (.type == "shared"),
                  (if (.secretValue | type) != "string" then "absent" elif .secretValue == $ENV[$k] then "equal" else "differs" end)
                ] | map(tostring) | join(" ") end' 2>/dev/null) || checks=unexpected
              resp=
              read -r key_ok version_ok env_ok type_ok echo <<<"$checks"
              if [[ "$key_ok $version_ok $env_ok $type_ok $echo" == "true true true true equal" ]]; then
                echo "KC_COPY_VERIFY $path $name match=true"
                done_rows=$((done_rows + 1))
                continue
              fi
              if [[ "$key_ok $version_ok $env_ok $type_ok" == "true true true true" ]]; then
                echo "KC_COPY_VERIFY $path $name match=false echo=$echo (created; value not confirmed)"
              else
                echo "$name $path created=unknown response=${checks//[^a-z ]/}"
              fi
            else
              exists=$(printf '%s' "${resp%$'\n'*}" | jq -r '(.message // "") | test("already exists")' 2>/dev/null) || exists=false
              resp=
              if [[ $exists == true ]]; then
                echo "$name $path created=no reason=already_exists (not overwritten)"
              elif [[ $status == 000 || $status == 5* ]]; then
                echo "$name $path created=unknown reason=http_$status (check in the console)"
              else
                echo "$name $path created=no reason=http_$status"
              fi
            fi
            not_attempted "$((done_rows + 1))"
            fail "stopped after $done_rows of ${#ROWS[@]} created and verified; reconcile before any other action"
          done
          echo "all ${#ROWS[@]} created and verified"

  probe-login:
    if: github.repository == 'Kilo-Org/kilocode' && github.ref == 'refs/heads/main' && github.triggering_actor == 'iscekic' && inputs.mode == 'probe-login'
    # Same runner, environment and workflow file as `copy`, so the OIDC token
    # carries the claims the identity was bound to. Only Infisical's 404 for a
    # missing OIDC Auth row counts as refused: a live identity answers a claim
    # or audience mismatch with 401 and a subject mismatch with 403.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: copy-secrets
    permissions:
      id-token: write
    steps:
      - name: Probe Infisical login (must be refused)
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IDENTITY_ID: ${{ inputs.identity_id }}
        run: |
          set +x
          readonly ORIGIN=https://eu.infisical.com
          readonly AUDIENCE=urn:kilocode:copy-secrets-to-infisical
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $IDENTITY_ID =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
            fail "identity_id is not a lowercase UUID"
          echo "identity_id=$IDENTITY_ID"
          aud=$(jq -rn --arg a "$AUDIENCE" '$a | @uri')
          jwt=$(curl -sS --fail --proto =https --connect-timeout 5 --max-time 15 \
            -K <(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | jq -r '.value // empty') || fail "GitHub OIDC token request failed"
          [[ -n $jwt ]] || fail "GitHub OIDC token request returned no token"
          login=$(printf '%s' "$jwt" | jq -Rc --arg id "$IDENTITY_ID" '{identityId: $id, jwt: .}' |
            curl -sS --proto =https --connect-timeout 5 --max-time 15 -H 'Content-Type: application/json' --data-binary @- \
              -w '\n%{http_code}' "$ORIGIN/api/v1/auth/oidc-auth/login") || login=$'\n000'
          jwt=
          status=${login##*$'\n'}
          # error code and detail.reasonCode (when present), restricted to letters
          # and underscores; whether the message is the missing-OIDC-Auth one.
          parsed=$(printf '%s' "${login%$'\n'*}" | jq -r '
            [ ((.error // "none") | tostring | gsub("[^A-Za-z_]"; "") | .[0:40]),
              ((.detail.reasonCode // .details.reasonCode // "none") | tostring | gsub("[^A-Za-z_]"; "") | .[0:40]),
              ((.message // "") | tostring | test("^OIDC auth method not found for identity")) ] | map(tostring) | join(" ")' 2>/dev/null) ||
            parsed="unparsed none false"
          token=$(printf '%s' "${login%$'\n'*}" | jq -r '.accessToken // empty' 2>/dev/null) || token=
          login=
          read -r code reason gone <<<"$parsed"
          refused=false
          if [[ $status == 404 && $gone == true && -z $token ]]; then
            refused=true
          fi
          echo "probe-login: HTTP $status error=${code:-none} reason=${reason:-none} refused=$refused"
          if [[ -n $token ]]; then
            rs=$(printf '%s' "$token" | jq -Rc '{accessToken: .}' |
              curl -sS -o /dev/null -w '%{http_code}' --proto =https --connect-timeout 5 --max-time 15 \
                -H 'Content-Type: application/json' --data-binary @- "$ORIGIN/api/v1/auth/token/revoke") || rs=000
            token=
            fail "Infisical issued an access token: the identity still accepts this workflow's login (token revoke: HTTP $rs)"
          fi
          [[ $refused == true ]] || fail "login was not refused as a deleted identity (HTTP $status, error=${code:-none}, reason=${reason:-none})"
