# kilocode_change - new file
name: "One-shot: copy secrets to Infisical (delete after use)"

# ONE-SHOT. Copies nine GitHub Actions secrets into Infisical EU (project kilo,
# environment production) at the /ci/ci-kilocode-* paths that the STS policies
# of the same names serve. Delete this file after the one successful run.
#
# - Auth: GitHub OIDC token -> Infisical OIDC Auth on a temporary machine
#   identity. Its role can only create these names on these paths: no read,
#   list, edit or delete. No Infisical credential is stored in GitHub.
# - Create-only: one POST /api/v4/secrets/<name> per target, no retry. A name
#   that already exists stops the run; nothing is updated or overwritten.
# - No value is printed, passed on a command line, or written to disk. For each
#   target the log shows a commitment: SHA-256 over (domain, path, name, value),
#   encrypted with RSA-OAEP to the operator's public key (input
#   verify_public_key). Only the holder of the private key can open it, and
#   compares it with a separate read of Infisical. The log also shows whether
#   the create response echoed the submitted value (equal / differs / absent).
# - mode probe-login (after the identity is deleted): a job with no secrets
#   mints the same OIDC token, tries the Infisical login once, writes nothing,
#   and passes only if Infisical refuses it. A successful login fails the job
#   (the token is revoked at once). Auth has no client secret, so this fresh
#   login attempt is the proof that the identity is gone.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "copy: create the secrets. probe-login: after the identity is deleted, prove Infisical refuses its login"
        required: true
        type: choice
        options:
          - copy
          - probe-login
      identity_id:
        description: Infisical machine identity ID (temporary, OIDC Auth only)
        required: true
        type: string
      verify_public_key:
        description: "mode copy: operator RSA public key (>= 3072 bits), base64 of the DER SubjectPublicKeyInfo"
        required: false
        type: string

concurrency:
  group: copy-secrets-to-infisical
  cancel-in-progress: false

permissions: {}

jobs:
  copy:
    if: github.repository == 'Kilo-Org/kilocode' && github.ref == 'refs/heads/main' && inputs.mode == 'copy'
    # GitHub-hosted, so the OIDC claim runner_environment is github-hosted.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: copy-secrets
    permissions:
      id-token: write
    steps:
      - name: Copy secrets (create-only)
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IDENTITY_ID: ${{ inputs.identity_id }}
          VERIFY_PUBLIC_KEY: ${{ inputs.verify_public_key }}
          V_JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          V_JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          V_JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          V_JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          V_SECURITY_ALERTS_SLACK_WEBHOOK: ${{ secrets.SECURITY_ALERTS_SLACK_WEBHOOK }}
          V_V2_SYNC_SLACK_WEBHOOK: ${{ secrets.V2_SYNC_SLACK_WEBHOOK }}
          V_COMMUNITY_TRIAGE_SLACK_TOKEN: ${{ secrets.COMMUNITY_TRIAGE_SLACK_TOKEN }}
          V_COMMUNITY_TRIAGE_SLACK_WEBHOOK: ${{ secrets.COMMUNITY_TRIAGE_SLACK_WEBHOOK }}
          V_OPENCODE_WATCH_SLACK_WEBHOOK: ${{ secrets.OPENCODE_WATCH_SLACK_WEBHOOK }}
        run: |
          set +x
          umask 077
          readonly ORIGIN=https://eu.infisical.com
          readonly PROJECT_ID=8cf601df-1c5a-4c8f-9e21-7e9af6728b06
          readonly ENVIRONMENT=production
          readonly AUDIENCE=urn:kilocode:copy-secrets-to-infisical
          readonly DOMAIN=kilocode-copy-secrets/v1
          readonly MAX_BYTES=65536
          # <variable holding the value> <Infisical path> <Infisical name>
          readonly ROWS=(
            "V_JETBRAINS_MARKETPLACE_TOKEN /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_MARKETPLACE_TOKEN"
            "V_JETBRAINS_PRIVATE_KEY /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_PRIVATE_KEY"
            "V_JETBRAINS_PRIVATE_KEY_PASSWORD /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_PRIVATE_KEY_PASSWORD"
            "V_JETBRAINS_CERTIFICATE_CHAIN /ci/ci-kilocode-release-jetbrains KILOCODE_JETBRAINS_CERTIFICATE_CHAIN"
            "V_SECURITY_ALERTS_SLACK_WEBHOOK /ci/ci-kilocode-scan-notify KILOCODE_SECURITY_ALERTS_SLACK_WEBHOOK"
            "V_SECURITY_ALERTS_SLACK_WEBHOOK /ci/ci-kilocode-notify KILOCODE_SECURITY_ALERTS_SLACK_WEBHOOK"
            "V_V2_SYNC_SLACK_WEBHOOK /ci/ci-kilocode-notify KILOCODE_V2_SYNC_SLACK_WEBHOOK"
            "V_COMMUNITY_TRIAGE_SLACK_TOKEN /ci/ci-kilocode-community KILOCODE_COMMUNITY_TRIAGE_SLACK_TOKEN"
            "V_COMMUNITY_TRIAGE_SLACK_WEBHOOK /ci/ci-kilocode-community KILOCODE_COMMUNITY_TRIAGE_SLACK_WEBHOOK"
            "V_OPENCODE_WATCH_SLACK_WEBHOOK /ci/ci-kilocode-opencode-watch KILOCODE_OPENCODE_WATCH_SLACK_WEBHOOK"
          )
          # Values reach jq through $ENV and openssl/iconv through pipes from the
          # printf builtin, never through argv or a file. Tokens reach curl
          # through a --config process substitution. Response bodies stay in
          # shell variables; only names, statuses and booleans are printed.

          fail() {
            echo "::error::$1"
            exit 1
          }
          auth() { printf 'header = "Authorization: Bearer %s"\n' "$token"; }

          token=
          revoke() {
            local rc=$? rs ps
            [[ -n $token ]] || return 0
            rs=$(printf '%s' "$token" | jq -Rc '{accessToken: .}' |
              curl -sS -o /dev/null -w '%{http_code}' --proto =https --max-time 20 \
                -H 'Content-Type: application/json' --data-binary @- "$ORIGIN/api/v1/auth/token/revoke") || rs=000
            ps=$(curl -sS -o /dev/null -w '%{http_code}' --proto =https --max-time 20 -K <(auth) \
              "$ORIGIN/api/v4/secrets?projectId=$PROJECT_ID&environment=$ENVIRONMENT&secretPath=/ci/ci-kilocode-notify&viewSecretValue=false") || ps=000
            token=
            revoked=false
            [[ $ps != 401 ]] || revoked=true
            echo "access token: revoke=HTTP $rs, request after revoke=HTTP $ps, revoked=$revoked"
            if [[ $revoked != true && $rc == 0 ]]; then
              echo "::error::the access token was not shown to be revoked"
              exit 1
            fi
          }
          trap revoke EXIT

          # ---- inputs ----
          [[ $IDENTITY_ID =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
            fail "identity_id is not a lowercase UUID"
          [[ $VERIFY_PUBLIC_KEY =~ ^[A-Za-z0-9+/]+={0,2}$ ]] || fail "verify_public_key is not base64"
          work=$(mktemp -d)
          pub="$work/verify-public-key.der" # the public key only; never a value
          printf '%s' "$VERIFY_PUBLIC_KEY" | base64 -d >"$pub" || fail "verify_public_key is not base64"
          keytext=$(openssl pkey -pubin -inform DER -in "$pub" -noout -text 2>/dev/null) ||
            fail "verify_public_key is not a DER public key"
          bits=$(sed -n 's/^Public-Key: (\([0-9]*\) bit)$/\1/p' <<<"$keytext")
          if ! grep -q '^Modulus:' <<<"$keytext" || [[ ${bits:-0} -lt 3072 ]]; then
            fail "verify_public_key must be an RSA key of at least 3072 bits"
          fi
          echo "verify key: RSA $bits bit, sha256(DER)=$(sha256sum <"$pub" | cut -c1-64)"

          # ---- every value, before any network call ----
          # Infisical trims the value on create (JavaScript String.trim, then
          # one trailing LF is kept if there was one). A value that would change
          # is refused, so Infisical stores exactly the GitHub secret.
          bad=0
          for row in "${ROWS[@]}"; do
            read -r var path name <<<"$row"
            value_ok=true
            reason=
            bytes=$(LC_ALL=C; v=${!var}; echo "${#v}")
            if [[ $bytes == 0 ]]; then
              reason=missing
            elif [[ $bytes -gt $MAX_BYTES ]]; then
              reason=too_large
            elif ! printf '%s' "${!var}" | iconv -f UTF-8 -t UTF-8 >/dev/null 2>&1; then
              reason=not_utf8
            elif [[ $(jq -n --arg k "$var" '
              def ws: "[\t\n\u000b\f\r \u00a0\u1680\u2000-\u200a\u2028\u2029\u202f\u205f\u3000\ufeff]+";
              def trimjs: sub("^" + ws; "") | sub(ws + "$"; "");
              $ENV[$k] as $v | ($v | if endswith("\n") then (trimjs + "\n") else trimjs end) == $v') != true ]]; then
              reason=would_be_trimmed
            fi
            if [[ -n $reason ]]; then
              value_ok=false
              bad=1
            fi
            echo "check $name $path value_ok=$value_ok${reason:+ reason=$reason}"
          done
          [[ $bad == 0 ]] || fail "refused before any write; nothing was sent to Infisical"

          # ---- commitments, before any write ----
          for row in "${ROWS[@]}"; do
            read -r var path name <<<"$row"
            c=$(printf '%s\n%s\n%s\n%s' "$DOMAIN" "$path" "$name" "${!var}" | openssl dgst -sha256 -binary |
              openssl pkeyutl -encrypt -pubin -keyform DER -inkey "$pub" -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 | base64 -w0)
            echo "KC_COPY_COMMIT $path $name $c"
          done

          # ---- GitHub OIDC token -> Infisical access token ----
          aud=$(jq -rn --arg a "$AUDIENCE" '$a | @uri')
          jwt=$(curl -sS --fail --proto =https --max-time 20 \
            -K <(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | jq -r '.value // empty') || fail "GitHub OIDC token request failed"
          [[ -n $jwt ]] || fail "GitHub OIDC token request returned no token"
          login=$(printf '%s' "$jwt" | jq -Rc --arg id "$IDENTITY_ID" '{identityId: $id, jwt: .}' |
            curl -sS --proto =https --max-time 20 -H 'Content-Type: application/json' --data-binary @- \
              -w '\n%{http_code}' "$ORIGIN/api/v1/auth/oidc-auth/login") || login=$'\n000'
          jwt=
          status=${login##*$'\n'}
          token=$(printf '%s' "${login%$'\n'*}" | jq -r '.accessToken // empty' 2>/dev/null) || token=
          ttl=$(printf '%s' "${login%$'\n'*}" | jq -r '.expiresIn // "unknown"' 2>/dev/null) || ttl=unknown
          login=
          [[ $status == 200 && -n $token ]] || fail "Infisical OIDC login refused: HTTP $status; nothing was written"
          echo "Infisical login: HTTP 200, expiresIn=$ttl"

          # ---- one create per target; stop at the first failure ----
          done_rows=0
          for row in "${ROWS[@]}"; do
            read -r var path name <<<"$row"
            resp=$(jq -nc --arg k "$var" --arg p "$path" --arg proj "$PROJECT_ID" --arg env "$ENVIRONMENT" \
              '{projectId: $proj, environment: $env, secretPath: $p, type: "shared", secretValue: $ENV[$k]}' |
              curl -sS --proto =https --max-time 30 -K <(auth) -H 'Content-Type: application/json' \
                --data-binary @- -w '\n%{http_code}' "$ORIGIN/api/v4/secrets/$name") || resp=$'\n000'
            status=${resp##*$'\n'}
            if [[ $status == 200 ]]; then
              # true/false for: key, version 1, environment, type, path; then the echo.
              checks=$(printf '%s' "${resp%$'\n'*}" | jq -r --arg k "$var" --arg n "$name" --arg p "$path" --arg env "$ENVIRONMENT" '
                if (.secret | type) != "object" then (if has("approval") then "approval" else "unexpected" end)
                else .secret | [
                  (.secretKey == $n), (.version == 1), (.environment == $env), (.type == "shared"),
                  ((.secretPath // $p) == $p),
                  (if (.secretValue | type) != "string" then "absent" elif .secretValue == $ENV[$k] then "equal" else "differs" end)
                ] | map(tostring) | join(" ") end' 2>/dev/null) || checks=unexpected
              resp=
              read -r key_ok version_ok env_ok type_ok path_ok echo <<<"$checks"
              if [[ "$key_ok $version_ok $env_ok $type_ok $path_ok" == "true true true true true" && $echo != differs ]]; then
                echo "$name $path created=yes version=1 echo=$echo"
                done_rows=$((done_rows + 1))
                continue
              fi
              echo "$name $path created=unknown response=${checks//[^a-z ]/}"
            else
              exists=$(printf '%s' "${resp%$'\n'*}" | jq -r '(.message // "") | test("already exists")' 2>/dev/null) || exists=false
              resp=
              if [[ $exists == true ]]; then
                echo "$name $path created=no reason=already_exists (not overwritten)"
              else
                echo "$name $path created=no reason=http_$status"
              fi
            fi
            for rest in "${ROWS[@]:$((done_rows + 1))}"; do
              read -r _ rpath rname <<<"$rest"
              echo "$rname $rpath created=no reason=not_attempted"
            done
            fail "stopped after $done_rows of ${#ROWS[@]} created; reconcile before any other action"
          done
          echo "all ${#ROWS[@]} created"

  probe-login:
    if: github.repository == 'Kilo-Org/kilocode' && github.ref == 'refs/heads/main' && inputs.mode == 'probe-login'
    # Same runner, environment and workflow file as `copy`, so the OIDC token
    # carries the claims the identity was bound to; a refusal then means the
    # identity (or its OIDC Auth) is gone, not that the claims differ.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: copy-secrets
    permissions:
      id-token: write
    steps:
      - name: Probe Infisical login (must be refused)
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          IDENTITY_ID: ${{ inputs.identity_id }}
        run: |
          set +x
          readonly ORIGIN=https://eu.infisical.com
          readonly AUDIENCE=urn:kilocode:copy-secrets-to-infisical
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $IDENTITY_ID =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] ||
            fail "identity_id is not a lowercase UUID"
          aud=$(jq -rn --arg a "$AUDIENCE" '$a | @uri')
          jwt=$(curl -sS --fail --proto =https --max-time 20 \
            -K <(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN") \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | jq -r '.value // empty') || fail "GitHub OIDC token request failed"
          [[ -n $jwt ]] || fail "GitHub OIDC token request returned no token"
          login=$(printf '%s' "$jwt" | jq -Rc --arg id "$IDENTITY_ID" '{identityId: $id, jwt: .}' |
            curl -sS --proto =https --max-time 20 -H 'Content-Type: application/json' --data-binary @- \
              -w '\n%{http_code}' "$ORIGIN/api/v1/auth/oidc-auth/login") || login=$'\n000'
          jwt=
          status=${login##*$'\n'}
          # error code (letters only), whether the message names the identity, and a token if one was issued.
          parsed=$(printf '%s' "${login%$'\n'*}" | jq -r '
            [ ((.error // "none") | tostring | gsub("[^A-Za-z]"; "") | .[0:40]),
              ((.message // "") | tostring | test("identity"; "i")) ] | map(tostring) | join(" ")' 2>/dev/null) || parsed="unparsed false"
          token=$(printf '%s' "${login%$'\n'*}" | jq -r '.accessToken // empty' 2>/dev/null) || token=
          login=
          read -r code names_identity <<<"$parsed"
          refused=false
          case $status in
            401 | 403) refused=true ;;
            400 | 404) [[ $names_identity != true ]] || refused=true ;;
          esac
          [[ -z $token ]] || refused=false
          echo "probe-login: HTTP $status error=${code:-none} refused=$refused"
          if [[ -n $token ]]; then
            rs=$(printf '%s' "$token" | jq -Rc '{accessToken: .}' |
              curl -sS -o /dev/null -w '%{http_code}' --proto =https --max-time 20 \
                -H 'Content-Type: application/json' --data-binary @- "$ORIGIN/api/v1/auth/token/revoke") || rs=000
            token=
            fail "Infisical issued an access token: the identity still accepts this workflow's login (token revoke: HTTP $rs)"
          fi
          [[ $refused == true ]] || fail "login was not refused in the expected way (HTTP $status, error=${code:-none})"
