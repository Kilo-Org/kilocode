# kilocode_change - new file
# Standalone smoke test — checks out kilo-bench and runs a small set of
# Harbor eval tasks against the latest published CLI (or a specific version).
#
# Tasks:  hello-world (~$0.01), log-summary-date-ranges (~$0.13)
# Expected total: < $0.50, < 15 min wall clock
#
# Triggers:
#   - workflow_dispatch: manually from Actions tab (optionally pass a CLI version)
#   - workflow_call: from publish.yml, with the CLI archive its smoke-cli job took from the draft release
#
# Required secrets (publish.yml passes them explicitly; a manual run reads the
# repository secrets):
#   KILO_API_KEY         — Kilo Gateway key
#   KILO_ORG_ID          — Kilo org ID
#   BENCH_GITHUB_TOKEN   — PAT with contents:read on Kilo-Org/kilo-bench (private repo)

name: smoke-test

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "CLI version to test (e.g. 7.0.36). Leave blank for latest npm release."
        required: false
        type: string
  workflow_call:
    inputs:
      cli_artifact:
        description: "Artifact of the calling run that holds kilo-linux-x64.tar.gz (empty while the bench is waived)."
        required: false
        type: string
        default: ""
      cli_sha256:
        description: "SHA-256 the archive must have (empty while the bench is waived)."
        required: false
        type: string
        default: ""
      waive_bench:
        description: "Skip the bench tests and record the release exception."
        type: boolean
        default: false
    secrets:
      KILO_API_KEY:
        description: "Kilo Gateway key."
        required: true
      KILO_ORG_ID:
        description: "Kilo organization ID."
        required: true
      BENCH_GITHUB_TOKEN:
        description: "Token with read access to Kilo-Org/kilo-bench."
        required: true

concurrency:
  group: smoke-test
  cancel-in-progress: false

permissions: {}

jobs:
  bench-exception:
    name: Record bench exception
    if: inputs.waive_bench
    runs-on: ubuntu-latest
    steps:
      - run: echo "The kilo-bench end-to-end tests are paused for stable and prerelease v1 releases until the release runner's BENCH_GITHUB_TOKEN access is approved. Run this workflow manually to verify access, then remove the waiver." >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke Test
    if: ${{ !inputs.waive_bench }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    # Published releases and the caller's artifacts need only read access. publish.yml passes the
    # draft's archive as an artifact (its smoke-cli job holds the push access drafts need).
    permissions:
      contents: read
    env:
      # kilo-bench's capture helper requires a Go toolchain >= 1.26. The runner
      # image pins GOTOOLCHAIN=local, so allow Go to fetch the required toolchain.
      GOTOOLCHAIN: auto
    steps:
      - name: Validate secrets
        env:
          KILO_API_KEY_SET: ${{ secrets.KILO_API_KEY != '' }}
          KILO_ORG_ID_SET: ${{ secrets.KILO_ORG_ID != '' }}
          BENCH_GITHUB_TOKEN_SET: ${{ secrets.BENCH_GITHUB_TOKEN != '' }}
        run: |
          missing=0
          for name in KILO_API_KEY KILO_ORG_ID BENCH_GITHUB_TOKEN; do
            flag="${name}_SET"
            if [[ "${!flag}" != "true" ]]; then
              echo "::error::${name} secret is not set."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout kilo-bench
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 # kilocode_change
        with:
          repository: Kilo-Org/kilo-bench
          token: ${{ secrets.BENCH_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"
          cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false # called from the release workflow

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Download CLI archive from the calling run
        if: inputs.cli_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.cli_artifact }}
          path: ${{ runner.temp }}/cli

      - name: Download CLI archive
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.cli_version }}
          ARTIFACT: ${{ inputs.cli_artifact }}
          EXPECTED: ${{ inputs.cli_sha256 }}
        run: |
          if [[ -n "$ARTIFACT" ]]; then
            ARCHIVE="$RUNNER_TEMP/cli/kilo-linux-x64.tar.gz"
            ACTUAL="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"
            if [[ -z "$EXPECTED" || "$ACTUAL" != "$EXPECTED" ]]; then
              echo "::error::kilo-linux-x64.tar.gz has digest $ACTUAL; the caller recorded ${EXPECTED:-none}."
              exit 1
            fi
            echo "cli_path=$ARCHIVE" >> "$GITHUB_OUTPUT"
            echo "::notice::Testing the CLI archive of the calling run ($ACTUAL)"
            exit 0
          fi
          if [[ -z "$VERSION" ]]; then
            echo "cli_path=" >> "$GITHUB_OUTPUT"
            echo "::notice::Testing latest CLI from npm"
            exit 0
          fi
          ARCHIVE="$RUNNER_TEMP/kilo-cli.tar.gz"
          gh release download "v$VERSION" \
            --repo "$GH_REPO" \
            --pattern kilo-linux-x64.tar.gz \
            --output "$ARCHIVE"
          echo "cli_path=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "::notice::Testing CLI v${VERSION} from local archive"

      # Harbor's default agent-setup timeout is 360s. The hello-world container
      # (FROM ubuntu:24.04) needs apt-get update + apt-get install + a NodeSource
      # curl|bash + apt install nodejs before the CLI even downloads, and on
      # the Blacksmith runners that occasionally pushes past 6 min when an apt
      # mirror or NodeSource cdn is slow, killing the run with
      # AgentSetupTimeoutError. Doubling the multiplier to 2 gives enough
      # headroom for transient mirror/cdn slowness while still finishing well
      # under timeout-minutes. Note: --timeout-multiplier scales every timeout
      # uniformly (setup, agent, verifier, env build), but they're all upper
      # limits so this is harmless.
      - name: Run smoke test — hello-world
        env:
          KILO_CLI_PATH: ${{ steps.cli.outputs.cli_path }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_ORG_ID: ${{ secrets.KILO_ORG_ID }}
        run: |
          ./scripts/run_eval.sh \
            -m kilo/anthropic/claude-sonnet-4.6 \
            -d hello-world \
            --job-name smoke-test-hello-world \
            --timeout-multiplier 2

      - name: Run smoke test — log-summary-date-ranges
        env:
          KILO_CLI_PATH: ${{ steps.cli.outputs.cli_path }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_ORG_ID: ${{ secrets.KILO_ORG_ID }}
        run: |
          ./scripts/run_eval.sh \
            -m kilo/anthropic/claude-sonnet-4.6 \
            -d terminal-bench-sample \
            --include-task-name "log-summary-date-ranges" \
            --job-name smoke-test-log-summary \
            --timeout-multiplier 2

      - name: Validate results
        run: python3 scripts/validate_smoke_test.py jobs/smoke-test-*/

      # Also upload the agent setup logs (stdout/stderr/return-code from the
      # CLI install script) so we can see exactly which step stalls when the
      # next AgentSetupTimeoutError happens. These come from the install
      # script in kilo-bench, which uses `set -euo pipefail` (no `set -x`)
      # and never echoes auth tokens or API keys, so the captured output is
      # safe to upload.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 # kilocode_change
        with:
          name: smoke-test-results
          path: |
            jobs/smoke-test-*/**/result.json
            jobs/smoke-test-*/**/trajectory.json
            jobs/smoke-test-*/**/agent/setup/*.txt
          retention-days: 30
          if-no-files-found: warn
