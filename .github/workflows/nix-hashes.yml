name: nix-hashes

# kilocode_change start
# Default is read; each job widens only what it uses.
permissions:
  contents: read
# kilocode_change end

on:
  workflow_dispatch:
    # kilocode_change start
    inputs:
      sts_check:
        description: "Only check that the Kilo STS bundle of ci-kilocode-app-key mints a Kilo Maintainer app token; compute and push no hashes"
        type: boolean
        default: false
    # kilocode_change end
  push:
    branches: [main]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/*/package.json"
      - "flake.lock"
      - "nix/node_modules.nix"
      - "nix/scripts/**"
      - "patches/**"
      - ".github/workflows/nix-hashes.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.sts_check && '-sts-check' || '' }} # kilocode_change - a check run neither cancels nor is cancelled by a hash run
  cancel-in-progress: true

jobs:
  # Native runners required: bun install cross-compilation flags (--os/--cpu)
  # do not produce byte-identical node_modules as native installs.
  compute-hash:
    if: github.repository == 'Kilo-Org/kilocode' && !inputs.sts_check # kilocode_change
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - system: aarch64-linux
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: blacksmith-6vcpu-macos-latest # kilocode_change
    runs-on: ${{ matrix.runner }}

    # kilocode_change start
    permissions:
      contents: read
    # kilocode_change end

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # kilocode_change start
        with:
          persist-credentials: false
        # kilocode_change end

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Compute node_modules hash
        id: hash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail

          BUILD_LOG=$(mktemp)
          trap 'rm -f "$BUILD_LOG"' EXIT

          HASH=""
          MAX_ATTEMPTS=3
          for ((ATTEMPT = 1; ATTEMPT <= MAX_ATTEMPTS; ATTEMPT++)); do
            # Build with fakeHash to trigger hash mismatch and reveal correct hash
            nix build ".#packages.${SYSTEM}.node_modules_updater" --no-link 2>&1 | tee "$BUILD_LOG" || true

            HASH="$(nix run --inputs-from . nixpkgs#gnugrep -- -oP 'got:\s*\Ksha256-[A-Za-z0-9+/=]+' "$BUILD_LOG" | tail -n1 || true)"

            [ -n "$HASH" ] && break

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Attempt ${ATTEMPT}/${MAX_ATTEMPTS} produced no hash for ${SYSTEM}; retrying in $((ATTEMPT * 10))s"
              sleep $((ATTEMPT * 10))
            fi
          done

          if [ -z "$HASH" ]; then
            echo "::error::Failed to compute hash for ${SYSTEM} after ${MAX_ATTEMPTS} attempts"
            cat "$BUILD_LOG"
            exit 1
          fi

          echo "$HASH" > hash.txt
          echo "Computed hash for ${SYSTEM}: $HASH"

      - name: Upload hash
        uses: actions/upload-artifact@v7 # kilocode_change
        with:
          name: hash-${{ matrix.system }}
          path: hash.txt
          retention-days: 1

  update-hashes:
    needs: compute-hash
    if: github.repository == 'Kilo-Org/kilocode' && github.event_name != 'pull_request' && !inputs.sts_check # kilocode_change
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # kilocode_change start - the Kilo Maintainer app key comes from the STS bundle of
    # ci-kilocode-app-key, which needs environment automation (main only) and id-token: write.
    # Read .github/actions/kilo-credentials/README.md before adding a step before "Read the STS bundle".
    environment: automation
    permissions:
      contents: read
      id-token: write
    # kilocode_change end

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 # kilocode_change
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # kilocode_change start
      - name: Read the STS bundle
        id: creds
        uses: ./.github/actions/kilo-credentials
        with:
          workload: ci-kilocode-app-key
          secrets: KILOCODE_MAINTAINER_APP_KEY
      # kilocode_change end

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          # kilocode_change start
          kilo-maintainer-app-id: ${{ secrets.KILO_MAINTAINER_APP_ID }}
          kilo-maintainer-app-secret: ${{ steps.creds.outputs.KILOCODE_MAINTAINER_APP_KEY }}
          repositories: kilocode
          permission-contents: write
          # kilocode_change end

      - name: Pull latest changes
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"

      - name: Download hash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 # kilocode_change
        with:
          path: hashes
          pattern: hash-*

      - name: Update hashes.json
        run: |
          set -euo pipefail

          HASH_FILE="nix/hashes.json"

          [ -f "$HASH_FILE" ] || echo '{"nodeModules":{}}' > "$HASH_FILE"

          for SYSTEM in x86_64-linux aarch64-linux x86_64-darwin aarch64-darwin; do
            FILE="hashes/hash-${SYSTEM}/hash.txt"
            if [ -f "$FILE" ]; then
              HASH="$(tr -d '[:space:]' < "$FILE")"
              echo "${SYSTEM}: ${HASH}"
              jq --arg sys "$SYSTEM" --arg h "$HASH" '.nodeModules[$sys] = $h' "$HASH_FILE" > tmp.json
              mv tmp.json "$HASH_FILE"
            else
              echo "::warning::Missing hash for ${SYSTEM}"
            fi
          done

          cat "$HASH_FILE"

      - name: Commit changes
        run: |
          set -euo pipefail

          HASH_FILE="nix/hashes.json"

          if [ -z "$(git status --short -- "$HASH_FILE")" ]; then
            echo "No changes to commit"
            echo "### Nix hashes" >> "$GITHUB_STEP_SUMMARY"
            echo "Status: no changes" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git add "$HASH_FILE"
          git commit -m "chore: update nix node_modules hashes"

          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

          echo "### Nix hashes" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: committed $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  # kilocode_change start
  # Manual check of the Kilo STS bundle, run only by `gh workflow run nix-hashes.yml -f sts_check=true`
  # on main. It reads KILOCODE_MAINTAINER_APP_KEY from the ci-kilocode-app-key bundle (STS policy in
  # Kilo-Org/cloud services/sts/policy/ci-kilocode-app-key.yaml, which names this workflow on main,
  # environment automation and the push and workflow_dispatch events) and mints a Kilo Maintainer
  # app token with metadata read only, which proves the stored key works. It pushes nothing, changes
  # no repository content and never prints the token. Read .github/actions/kilo-credentials/README.md
  # before changing it.
  sts-check:
    if: github.repository == 'Kilo-Org/kilocode' && inputs.sts_check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::sts_check runs only on refs/heads/main, not $GITHUB_REF"
            exit 1
          fi

      - name: Checkout the kilo-credentials action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/kilo-credentials

      - name: Read the STS bundle
        id: creds
        uses: ./.github/actions/kilo-credentials
        with:
          workload: ci-kilocode-app-key
          secrets: KILOCODE_MAINTAINER_APP_KEY

      - name: Mint a Kilo Maintainer app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.KILO_MAINTAINER_APP_ID }}
          private-key: ${{ steps.creds.outputs.KILOCODE_MAINTAINER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kilocode
          permission-metadata: read

      - name: Report
        run: echo "Minted a Kilo Maintainer app token for kilocode from the STS bundle of ci-kilocode-app-key"
  # kilocode_change end
