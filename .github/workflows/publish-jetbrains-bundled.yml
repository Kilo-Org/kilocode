# kilocode_change - new file
name: publish-jetbrains-bundled

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Merged JetBrains release PR number to bundle
        required: true
        type: string
      merge_commit:
        description: Merge commit SHA from the reviewed release PR
        required: true
        type: string

concurrency:
  group: publish-jetbrains-bundled-pr-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    if: github.repository == 'Kilo-Org/kilocode' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      kind: ${{ steps.release.outputs.kind }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      channel: ${{ steps.release.outputs.marketplace_channel }}
      merge: ${{ steps.release.outputs.merge }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run publish-jetbrains-bundled from main (got $GITHUB_REF). Nothing was built."
            exit 1
          fi

      - name: Checkout trusted validation scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Bun for validation
        uses: ./.github/actions/setup-bun
        with:
          cache: false # validate's outputs choose what bundle signs

      # Checks the PR with the job token before any of its files are checked out.
      - name: Check the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          MERGE_COMMIT: ${{ inputs.merge_commit }}
        run: |
          pr="$PR_INPUT"
          if ! [[ "$pr" =~ ^[1-9][0-9]*$ && "$MERGE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::pr must be a positive integer and merge_commit a full commit SHA."
            exit 1
          fi
          if ! gh api "repos/$REPO/pulls/$pr" | jq -e --arg repo "$REPO" --arg merge "$MERGE_COMMIT" '
            .merged == true and .base.ref == "main" and .head.repo.full_name == $repo
            and any(.labels[]; .name == "jetbrains-release")
            and (.merge_commit_sha | ascii_downcase) == ($merge | ascii_downcase)' > /dev/null; then
            echo "::error::PR #$pr is not a merged jetbrains-release PR from this repository into main with merge commit $MERGE_COMMIT."
            exit 1
          fi

      - name: Checkout merged release PR for validation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: release
          persist-credentials: false
          ref: ${{ inputs.merge_commit }}

      # Runs from the trusted checkout: release/ is only read through git and
      # file reads, so nothing in it (bunfig.toml, scripts) is executed.
      - name: Validate release PR and tag
        id: release
        run: bun script/jetbrains-release-validate.ts --dir release --pr "$PR_NUMBER" --merge "$MERGE_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          MERGE_COMMIT: ${{ inputs.merge_commit }}

  # The signing key, its certificate chain and password come from the STS bundle of
  # ci-kilocode-release-jetbrains, which needs environment release-jetbrains (main only), a
  # workflow_dispatch run on main and id-token: write. Read .github/actions/kilo-credentials/README.md
  # before adding or moving a step.
  bundle:
    needs: validate
    if: github.repository == 'Kilo-Org/kilocode' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: release-jetbrains
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    outputs:
      version: ${{ needs.validate.outputs.version }}
      kind: ${{ needs.validate.outputs.kind }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run publish-jetbrains-bundled from main (got $GITHUB_REF). Nothing was built."
            exit 1
          fi

      - name: Checkout merged release PR metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.merge }}

      - name: Save reviewed release metadata
        run: |
          cp packages/kilo-jetbrains/CHANGELOG.md "$RUNNER_TEMP/jetbrains-CHANGELOG.md"
          cp packages/kilo-jetbrains/gradle.properties "$RUNNER_TEMP/jetbrains-gradle.properties"

      # The validated commit, not the tag name: a tag moved after validation
      # is not picked up. The tag name is only used to name the release.
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false

      - name: Restore reviewed release metadata
        run: |
          cp "$RUNNER_TEMP/jetbrains-CHANGELOG.md" packages/kilo-jetbrains/CHANGELOG.md
          cp "$RUNNER_TEMP/jetbrains-gradle.properties" packages/kilo-jetbrains/gradle.properties

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          cache: false # job holds write scopes, id-token and signing secrets

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true # job signs with release secrets

      - name: Setup SBOM tooling
        uses: ./.github/actions/setup-sbom

      # The credential action runs from the dispatched main commit, not from the release commit,
      # which can predate it. Nothing else is read from this checkout.
      - name: Checkout the credential action from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: trusted-actions
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/kilo-credentials/

      # Writes the private key and the certificate chain to mode 0600 files and sets their paths.
      - name: Read the STS bundle
        id: creds
        uses: ./trusted-actions/.github/actions/kilo-credentials
        with:
          workload: ci-kilocode-release-jetbrains
          secrets: |
            KILOCODE_JETBRAINS_PRIVATE_KEY
            KILOCODE_JETBRAINS_PRIVATE_KEY_PASSWORD
            KILOCODE_JETBRAINS_CERTIFICATE_CHAIN

      - name: Build signed bundled plugin
        working-directory: packages/kilo-jetbrains
        run: |
          args=(
            -Pproduction=true
            -Pkilo.version="$VERSION"
            -Pkilo.channel="$CHANNEL"
            -Pkilo.cli.bundled=true
          )
          ./gradlew clean buildPlugin signPlugin verifyPluginSignature verifyPlugin "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          JETBRAINS_PRIVATE_KEY_FILE: ${{ steps.creds.outputs.KILOCODE_JETBRAINS_PRIVATE_KEY_FILE }}
          JETBRAINS_CERTIFICATE_CHAIN_FILE: ${{ steps.creds.outputs.KILOCODE_JETBRAINS_CERTIFICATE_CHAIN_FILE }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ steps.creds.outputs.KILOCODE_JETBRAINS_PRIVATE_KEY_PASSWORD }}

      - name: Remove signing key files
        if: always()
        env:
          KEY_FILE: ${{ steps.creds.outputs.KILOCODE_JETBRAINS_PRIVATE_KEY_FILE }}
          CHAIN_FILE: ${{ steps.creds.outputs.KILOCODE_JETBRAINS_CERTIFICATE_CHAIN_FILE }}
        run: rm -f -- "$KEY_FILE" "$CHAIN_FILE"

      - name: Resolve bundled archive
        id: archive
        run: |
          mapfile -t signed < <(compgen -G "packages/kilo-jetbrains/build/distributions/*-signed.zip")
          if [[ "${#signed[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed bundled JetBrains plugin ZIP, found ${#signed[@]}." >&2
            printf '%s\n' "${signed[@]}" >&2
            exit 1
          fi
          asset="kilo-code-${VERSION}-bundled.zip"
          dest="packages/kilo-jetbrains/build/release/$asset"
          mkdir -p "$(dirname "$dest")"
          cp "${signed[0]}" "$dest"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      # One release publishes two plugin artifacts from two workflows, so the
      # already-published lean manifest is pulled back in and merged. Without it
      # the release would claim it only ever produced the bundled ZIP.
      # Absent evidence is a legitimate state (the lean run may have produced
      # none in advisory mode), so that case continues. Evidence that exists but
      # cannot be fetched fails the step: continuing would upload a bundled-only
      # manifest over the published one and permanently drop the lean evidence.
      # The sidecars listed in the manifest are restored alongside it because
      # verification resolves them relative to the manifest directory.
      - name: Restore published JetBrains SBOM manifest
        run: |
          set -euo pipefail
          dir=packages/kilo-jetbrains/build/release
          mkdir -p "$dir"
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")"
          if ! grep -qx jetbrains-sbom-evidence.json <<<"$assets"; then
            echo "No published JetBrains SBOM manifest on $TAG yet; bundled evidence starts a new one."
            exit 0
          fi
          gh release download "$TAG" --pattern jetbrains-sbom-evidence.json --dir "$dir" --clobber --repo "$GITHUB_REPOSITORY"
          mapfile -t sidecars < <(jq -r '.entries[] | select(.sbom) | .sbom' "$dir/jetbrains-sbom-evidence.json")
          for sidecar in "${sidecars[@]}"; do
            if grep -qx "$sidecar" <<<"$assets"; then
              gh release download "$TAG" --pattern "$sidecar" --dir "$dir" --clobber --repo "$GITHUB_REPOSITORY"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}

      # The bundled ZIP embeds all six CLI builds, so its evidence is generated
      # separately from the lean plugin and merged into the same release manifest.
      - name: Generate bundled plugin SBOM
        id: sbom
        run: |
          bun packages/kilo-jetbrains/script/sbom.ts \
            --zip "$ARCHIVE" \
            --variant bundled \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --tag "$TAG" \
            --merge "$MERGE_COMMIT"
          echo "sidecar=$ARCHIVE.cdx.json" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          TAG: ${{ needs.validate.outputs.tag }}
          MERGE_COMMIT: ${{ needs.validate.outputs.merge }}
          SBOM_ENFORCE: ${{ vars.SBOM_ENFORCE }}

      - name: Attest bundled plugin SBOM
        continue-on-error: ${{ vars.SBOM_ENFORCE != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.sbom.outputs.name }}
          subject-digest: ${{ steps.sbom.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.sidecar }}

      - name: Upload bundled ZIP to GitHub Release
        run: |
          # The release must name the commit that was validated and built.
          git fetch --force --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          actual="$(git rev-parse "$TAG^{commit}")"
          if [[ "$actual" != "$COMMIT" ]]; then
            echo "::error::$TAG points at $actual, not the validated commit $COMMIT. Nothing was uploaded."
            exit 1
          fi
          gh release upload "$TAG" "$ARCHIVE" $EVIDENCE --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          EVIDENCE: ${{ steps.sbom.outputs.sidecar }} packages/kilo-jetbrains/build/release/jetbrains-sbom-evidence.json packages/kilo-jetbrains/build/release/kilo-jetbrains-SHA256SUMS

      - name: Resolve bundled asset URL
        id: asset
        run: |
          url="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == env.ASSET) | .url' --repo "$GITHUB_REPOSITORY")"
          if [[ -z "$url" ]]; then
            echo "Could not resolve GitHub Release URL for $ASSET" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          ASSET: ${{ steps.archive.outputs.asset }}

      - name: Generate stable plugin repository XML
        if: needs.validate.outputs.kind == 'stable'
        run: |
          mkdir -p pages/jetbrains
          python3 <<'PY'
          import html
          import io
          import os
          import zipfile
          import xml.etree.ElementTree as ET

          archive = os.environ["ARCHIVE"]
          asset = os.environ["ASSET_URL"]
          version = os.environ["VERSION"]

          def plugin_xml(path):
              with zipfile.ZipFile(path) as zip:
                  for name in zip.namelist():
                      if name.endswith("META-INF/plugin.xml"):
                          return zip.read(name)
                  for name in zip.namelist():
                      if not name.endswith(".jar"):
                          continue
                      with zipfile.ZipFile(io.BytesIO(zip.read(name))) as jar:
                          for item in jar.namelist():
                              if item.endswith("META-INF/plugin.xml"):
                                  return jar.read(item)
              raise SystemExit("bundled plugin ZIP did not contain META-INF/plugin.xml")

          root = ET.fromstring(plugin_xml(archive))

          def text(name, default=""):
              item = root.find(name)
              return item.text.strip() if item is not None and item.text else default

          def cdata(value):
              return "<![CDATA[" + value.replace("]]>", "]]]]><![CDATA[>") + "]]>"

          plugin = text("id", "ai.kilocode.jetbrains")
          name = text("name", "Kilo Code")
          vendor = text("vendor", "Kilo Code")
          desc = text("description")
          notes = text("change-notes")
          idea = root.find("idea-version")
          attrs = ""
          if idea is not None:
              since = idea.attrib.get("since-build")
              until = idea.attrib.get("until-build")
              if since:
                  attrs += f' since-build="{html.escape(since)}"'
              if until:
                  attrs += f' until-build="{html.escape(until)}"'

          xml = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<plugins>',
              f'  <plugin id="{html.escape(plugin)}" version="{html.escape(version)}" url="{html.escape(asset)}">',
              f'    <name>{html.escape(name)}</name>',
              f'    <vendor>{html.escape(vendor)}</vendor>',
              f'    <idea-version{attrs}/>',
          ]
          if desc:
              xml.append(f'    <description>{cdata(desc)}</description>')
          if notes:
              xml.append(f'    <change-notes>{cdata(notes)}</change-notes>')
          xml.extend(['  </plugin>', '</plugins>', ''])
          with open("pages/jetbrains/updatePlugins.xml", "w", encoding="utf-8") as file:
              file.write("\n".join(xml))
          PY
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
          ASSET_URL: ${{ steps.asset.outputs.url }}
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Upload stable Pages source
        if: needs.validate.outputs.kind == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jetbrains-pages-${{ needs.validate.outputs.version }}
          path: pages
          if-no-files-found: error

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kilo-jetbrains-bundled-${{ needs.validate.outputs.version }}
          path: |
            packages/kilo-jetbrains/build/release/*.zip
            packages/kilo-jetbrains/build/release/*.cdx.json
            packages/kilo-jetbrains/build/release/jetbrains-sbom-evidence.json
            packages/kilo-jetbrains/build/release/kilo-jetbrains-SHA256SUMS
            pages/jetbrains/updatePlugins.xml
          if-no-files-found: ignore

  pages:
    needs: bundle
    if: needs.bundle.outputs.kind == 'stable'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stable Pages source
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-pages-${{ needs.bundle.outputs.version }}
          path: pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
