name: test

on:
  push:
    branches:
      - main # kilocode_change
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch # kilocode_change
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/main', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }} # kilocode_change
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # kilocode_change start
  changes:
    name: detect general unit test changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      settings: ${{ steps.matrix.outputs.settings }}
      general: ${{ steps.matrix.outputs.general }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v6

      - name: Detect general unit test changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: Kilo-Org/paths-filter@668c092af3649c4b664c54e4b704aa46782f6f7c # v3
        with:
          predicate-quantifier: every
          filters: |
            general:
              - '**'
              - '!.changeset/**'
              - '!packages/kilo-jetbrains/**'
              - '!packages/kilo-vscode/**'
              - '!packages/kilo-docs/**'
              - '!packages/extensions/zed/**'
              - '!specs/**'
              - '!perf/**'

      - name: Configure unit matrix
        id: matrix
        env:
          GENERAL: ${{ github.event_name != 'pull_request' || steps.filter.outputs.general == 'true' }}
        run: |
          if [ "$GENERAL" != "true" ]; then
            echo 'general=false' >> "$GITHUB_OUTPUT"
            echo 'settings=[{"os":"linux","index":1,"total":1,"host":"blacksmith-4vcpu-ubuntu-2404","run":false,"packages":false}]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'general=true' >> "$GITHUB_OUTPUT"
          # kilocode_change start - rebalanced shard counts: Linux 8 CLI shards + a dedicated
          # packages job, Windows 4->6. Duration weighting alone could not get Linux under ~5m,
          # for two measured reasons (CI run 31648508417, Linux at 4 shards):
          #   1. Shard 1 was the straggler at 6m51s against ~4m25s for its siblings, purely
          #      because it also ran every non-CLI package test. Those now get their own job,
          #      which makes the CLI shards symmetric and lets shard count actually buy time.
          #   2. Per-file process spawn is ~3s on Linux, so cost tracks file count. The old
          #      config-overlay.test.ts held 34 tests / 180s in ONE file, and the runner spawns
          #      one process per *file* -- so no weighting scheme could break up those 180s.
          #      It imposed a ~3.05m floor at any shard count (8 -> 3.05m, 10 -> 3.05m).
          #      It is now four files, so shards help again: modelled makespan 4 -> 5.05m,
          #      6 -> 3.78m, 7 -> 3.09m, 8 -> 2.66m. 8 is the first count under the 2m15-2m45
          #      target, hence 8 rather than 6.
          # Generated rather than written out: 16 entries on one line is not reviewable.
          LINUX_HOST=blacksmith-4vcpu-ubuntu-2404
          WINDOWS_HOST=blacksmith-4vcpu-windows-2025
          LINUX_SHARDS=8
          WINDOWS_SHARDS=6
          # os host index total packages
          shard() { printf '{"os":"%s","index":%s,"total":%s,"host":"%s","run":true,"packages":%s},' "$1" "$3" "$4" "$2" "$5"; }
          settings="$(
            {
              printf '['
              # Non-CLI packages and root tooling tests run alone, off the critical path of the
              # CLI shards. Note: no apostrophes in comments inside this command substitution --
              # bash parses them as an unterminated quote and the step dies with "unexpected EOF".
              printf '{"os":"linux","index":"packages","total":0,"host":"%s","run":true,"packages":true,"packagesOnly":true},' "$LINUX_HOST"
              for i in $(seq 1 "$LINUX_SHARDS"); do shard linux "$LINUX_HOST" "$i" "$LINUX_SHARDS" false; done
              shard macos macos-15 1 1 true
              for i in $(seq 1 "$WINDOWS_SHARDS"); do
                if [ "$i" = 1 ]; then packages=true; else packages=false; fi
                shard windows "$WINDOWS_HOST" "$i" "$WINDOWS_SHARDS" "$packages"
              done
              printf ']'
            } | sed 's/,]$/]/'
          )"
          echo "settings=$settings" >> "$GITHUB_OUTPUT"
          # kilocode_change end
  # kilocode_change end
  unit:
    # kilocode_change start
    name: ${{ !matrix.settings.run && 'unit (unchanged)' || matrix.settings.packagesOnly && format('unit ({0}, packages)', matrix.settings.os) || matrix.settings.total > 1 && format('unit ({0}, {1}/{2})', matrix.settings.os, matrix.settings.index, matrix.settings.total) || format('unit ({0})', matrix.settings.os) }}
    needs: changes
    # kilocode_change end
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.changes.outputs.settings) }} # kilocode_change
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45 # kilocode_change
    defaults:
      run:
        shell: bash
    steps:
      # kilocode_change start
      - name: Skip unchanged general unit tests
        if: ${{ !matrix.settings.run }}
        run: echo "Only isolated product, documentation, or metadata files changed; general unit tests are unchanged."
      # kilocode_change end

      # kilocode_change start - exempt the workspace and temp dirs from Defender on Windows.
      # Measured from CI run 31648508417: per-file process spawn costs ~6.0s on Windows against
      # ~3.0s on Linux, and that spawn tax is 3978s of the 7142s of total Windows work (56%).
      # Every `bun test <file>` is a fresh image load plus a tree of temp git repos, and
      # real-time scanning inspects all of it. Nothing in CI excluded these paths before.
      # Runs before checkout so install and test writes are both covered.
      #
      # Deliberately best-effort: Defender may be absent, already disabled, or locked by tamper
      # protection on some runner images, and none of that should fail the unit matrix. The step
      # reports what it managed to apply so a regression in spawn cost is diagnosable from logs.
      - name: Exempt workspace from Defender scanning
        if: matrix.settings.run && runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Command Add-MpPreference -ErrorAction SilentlyContinue)) {
            Write-Host "Add-MpPreference unavailable; skipping Defender exclusions."
            exit 0
          }
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, "$env:USERPROFILE\.bun") |
            Where-Object { $_ } | Select-Object -Unique
          foreach ($p in $paths) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop; Write-Host "excluded path $p" }
            catch { Write-Host "could not exclude path $p : $($_.Exception.Message)" }
          }
          foreach ($proc in @("bun.exe", "node.exe", "git.exe")) {
            try { Add-MpPreference -ExclusionProcess $proc -ErrorAction Stop; Write-Host "excluded process $proc" }
            catch { Write-Host "could not exclude process $proc : $($_.Exception.Message)" }
          }
      # kilocode_change end
      - name: Checkout repository
        if: matrix.settings.run # kilocode_change
        uses: actions/checkout@v6 # kilocode_change
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # kilocode_change start
      - name: Setup Node
        if: matrix.settings.run
        id: setup-node
        continue-on-error: ${{ runner.os == 'Windows' }}
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # kilocode_change end

      # kilocode_change start
      - name: Retry Setup Node on Windows
        if: matrix.settings.run && runner.os == 'Windows' && steps.setup-node.outcome == 'failure'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      # kilocode_change end

      - name: Setup Bun
        if: matrix.settings.run # kilocode_change
        uses: ./.github/actions/setup-bun

      # kilocode_change start
      - name: Setup Linux sandbox helper
        if: matrix.settings.run && runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-sandbox
      # kilocode_change end
      - name: Configure git identity
        if: matrix.settings.run # kilocode_change
        # kilocode_change start
        run: |
          git config --global user.email "kilo-maintainer[bot]@users.noreply.github.com"
          git config --global user.name "kilo-maintainer[bot]"
        # kilocode_change end

      - name: Cache Turbo
        if: matrix.settings.run # kilocode_change
        uses: actions/cache@v5 # kilocode_change
        with:
          path: .turbo/cache # kilocode_change
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}-${{ matrix.settings.os }}-${{ matrix.settings.index }}-${{ github.sha }} # kilocode_change
          # kilocode_change start
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}-${{ matrix.settings.os }}-${{ matrix.settings.index }}-
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}-
            turbo-${{ runner.os }}-
          # kilocode_change end

      # kilocode_change start - reuse the previous run's merged junit.xml so the runner can weight shards by observed wall-clock duration instead of file size
      - name: Restore unit junit history
        # kilocode_change - the packages job runs no CLI shard, so it has no durations to weight
        # and never writes packages/opencode/.artifacts/unit/junit.xml. Skip all three history
        # steps there; actions/cache/save in particular hard-fails on a missing path.
        if: matrix.settings.run && !matrix.settings.packagesOnly
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/opencode/.artifacts/unit/junit.xml
          key: unit-junit-${{ runner.os }}-${{ matrix.settings.index }}-${{ matrix.settings.total }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            unit-junit-${{ runner.os }}-${{ matrix.settings.index }}-${{ matrix.settings.total }}-${{ github.ref }}-
            unit-junit-${{ runner.os }}-${{ matrix.settings.index }}-${{ matrix.settings.total }}-
            unit-junit-${{ runner.os }}-

      # kilocode_change start - cross-shard history: the aggregated junit from the previous run's `aggregate-junit-history` job, so each shard sees the slow files from sibling shards too
      - name: Restore aggregated unit junit history
        if: matrix.settings.run && matrix.settings.os != 'macos' && !matrix.settings.packagesOnly # kilocode_change
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/opencode/.artifacts/unit/aggregate-${{ runner.os }}.xml
          key: unit-junit-${{ runner.os }}-aggregate-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            unit-junit-${{ runner.os }}-aggregate-${{ github.ref }}-
            unit-junit-${{ runner.os }}-aggregate-
            unit-junit-${{ runner.os }}-

      # kilocode_change start - test non-CLI packages separately from sharded CLI tests
      - name: Verify package test scheduling
        if: matrix.settings.run && matrix.settings.packages && matrix.settings.os == 'linux'
        run: bun run script/check-test-ci.ts

      - name: Run root tooling unit tests
        if: matrix.settings.run && matrix.settings.packages && matrix.settings.os == 'linux'
        run: bun run test:script:ci

      - name: Run non-CLI unit tests
        if: matrix.settings.run && matrix.settings.packages
        run: bun turbo test:ci --output-logs=errors-only --log-order=grouped --log-prefix=task --filter='!@kilocode/cli' --filter='!@kilocode/kilo-jetbrains'
        env:
          KILO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true" # kilocode_change - non-CLI tests use the watcher-free unit-test profile
      # kilocode_change end

      # kilocode_change start - ensure the Darwin profile cannot suppress its own validation
      - name: Validate Darwin CLI test profile
        if: matrix.settings.run && matrix.settings.os == 'macos'
        working-directory: packages/opencode
        run: bun test test/kilocode/test-profile.test.ts
      # kilocode_change end

      # kilocode_change start - run Kilo CLI tests through platform-specific shards
      - name: Run CLI unit tests
        # kilocode_change - the Linux packages job carries no CLI shard, so it skips this step.
        if: matrix.settings.run && !matrix.settings.packagesOnly
        run: bun turbo test:ci --output-logs=errors-only --log-order=grouped --log-prefix=task --filter='@kilocode/cli'
        env:
          KILO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true" # kilocode_change - was Windows-only; the CLI now starts a watcher per instance, too heavy/racy for unit tests. Watcher tests opt back in.
          KILO_TEST_PROFILE: ${{ matrix.settings.os == 'macos' && 'darwin' || '' }}
          KILO_TEST_SHARD: ${{ format('{0}/{1}', matrix.settings.index, matrix.settings.total) }}
          KILO_TEST_HISTORY_DIR: ${{ matrix.settings.os == 'macos' && '' || '.artifacts/unit' }} # kilocode_change - feed observed durations into the sharder (runner cwd is packages/opencode, so this is runner-relative)
      # kilocode_change end

      # kilocode_change start - persist the freshly merged junit.xml so the next run can balance by wall-clock duration
      - name: Save unit junit history
        if: always() && matrix.settings.run && matrix.settings.os != 'macos' && !matrix.settings.packagesOnly # kilocode_change
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/opencode/.artifacts/unit/junit.xml
          key: unit-junit-${{ runner.os }}-${{ matrix.settings.index }}-${{ matrix.settings.total }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

      # kilocode_change start
      - name: Publish unit reports
        if: always() && matrix.settings.run
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386 # v6.4.0
        with:
          report_paths: |
            .artifacts/unit/junit.xml
            packages/*/.artifacts/unit/junit.xml
          annotate_only: true
          detailed_summary: true
          include_time_in_summary: true
          fail_on_failure: false

      - name: Upload unit artifacts
        if: always() && matrix.settings.run
        uses: actions/upload-artifact@v7
        with:
          name: unit-${{ matrix.settings.os }}-${{ matrix.settings.index }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .artifacts/unit/junit.xml
            packages/*/.artifacts/unit/junit.xml
      # kilocode_change end

  # kilocode_change start - combine every per-shard junit into one per-OS aggregated file so sibling shards share slow-file history on the next run
  aggregate-junit-history:
    name: aggregate junit history
    needs: unit
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Without merge-multiple, each `unit-<os>-<i>-<attempt>` artifact lands
      # in its own subdirectory under `artifacts/`, preserving the inner
      # path (`packages/opencode/.artifacts/unit/junit.xml`) so the
      # aggregator can find the per-shard junits.
      - name: Download unit artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: unit-*

      - name: Aggregate per-OS junit
        working-directory: packages/opencode
        # cwd is packages/opencode; the output path is relative to that so
        # the file lands at <workspace>/packages/opencode/.artifacts/unit,
        # which matches the path the unit matrix restores.
        run: bun script/kilocode/aggregate-junit-history.ts ../../artifacts .artifacts/unit

      # Save at the exact workspace-relative path the unit matrix restores
      # to — `actions/cache` does not relocate files on restore, so the
      # save path must match the restore path byte-for-byte.
      - name: Save Linux aggregate
        if: hashFiles('packages/opencode/.artifacts/unit/aggregate-Linux.xml') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/opencode/.artifacts/unit/aggregate-Linux.xml
          key: unit-junit-Linux-aggregate-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Windows aggregate
        if: hashFiles('packages/opencode/.artifacts/unit/aggregate-Windows.xml') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/opencode/.artifacts/unit/aggregate-Windows.xml
          key: unit-junit-Windows-aggregate-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
  # kilocode_change end

  # kilocode_change start
  httpapi:
    name: HttpApi exerciser
    needs: changes
    if: needs.changes.outputs.general == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Linux sandbox helper
        uses: ./.github/actions/setup-linux-sandbox

      - name: Configure git identity
        run: |
          git config --global user.email "kilo-maintainer[bot]@users.noreply.github.com"
          git config --global user.name "kilo-maintainer[bot]"

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}-httpapi-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}-httpapi-
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated
      - name: Run HttpApi exerciser gates
        run: bun turbo test:httpapi --filter='@kilocode/cli'
        env:
          KILO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true" # kilocode_change - a watcher per scenario instance is too heavy for the exerciser

  # kilocode_change end

  # kilocode_change start
  jetbrains:
    name: jetbrains
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/test-jetbrains.yml
  # kilocode_change end

  # kilocode_change start
  unit-required:
    name: unit (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - unit
    if: always()
    steps:
      - name: Verify unit matrix passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          test "${{ needs.unit.result }}" = "success"
  # kilocode_change end
  # kilocode_change start
  required:
    name: test (linux)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - changes
      - unit
      - httpapi
      - jetbrains
    if: always()
    steps:
      - name: Verify upstream test jobs passed # kilocode_change
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "httpapi=${{ needs.httpapi.result }}"
          echo "jetbrains=${{ needs.jetbrains.result }}"
          test "${{ needs.unit.result }}" = "success"
          if [ "${{ needs.changes.outputs.general }}" = "true" ]; then
            test "${{ needs.httpapi.result }}" = "success"
          else
            test "${{ needs.httpapi.result }}" = "skipped"
          fi
          test "${{ needs.jetbrains.result }}" = "success"
  # kilocode_change end
