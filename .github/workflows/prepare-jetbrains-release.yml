# kilocode_change - new file
name: prepare-jetbrains-release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Release kind"
        required: true
        type: choice
        options:
          - rc
          - stable
      version:
        description: "Version, e.g. 7.3.13-rc.1 or 7.3.13"
        required: true
        type: string
      from_tag:
        description: "Optional previous tag for changelog range"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-jetbrains-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Kilo-Org/kilocode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The Kilo Maintainer app key comes from the STS bundle of ci-kilocode-app-key, which needs
    # environment automation (main only) and id-token: write. Read
    # .github/actions/kilo-credentials/README.md before adding a step before "Read the STS bundle".
    environment: automation
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the STS bundle
        id: creds
        uses: ./.github/actions/kilo-credentials
        with:
          workload: ci-kilocode-app-key
          secrets: KILOCODE_MAINTAINER_APP_KEY

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          cache: false # job holds the maintainer app secrets

      - name: Setup Git Committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          kilo-maintainer-app-id: ${{ secrets.KILO_MAINTAINER_APP_ID }}
          kilo-maintainer-app-secret: ${{ steps.creds.outputs.KILOCODE_MAINTAINER_APP_KEY }}
          repositories: kilocode
          permission-contents: write
          permission-pull-requests: write

      - name: Create release tag and PR
        run: |
          args=(--kind "$KIND" --version "$VERSION")
          if [[ -n "$FROM_TAG" ]]; then
            args+=(--from-tag "$FROM_TAG")
          fi
          bun script/jetbrains-release-pr.ts "${args[@]}"
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ inputs.kind }}
          VERSION: ${{ inputs.version }}
          FROM_TAG: ${{ inputs.from_tag }}
