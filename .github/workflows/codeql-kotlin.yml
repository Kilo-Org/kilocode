# kilocode_change - new file
name: "CodeQL Kotlin"

on:
  push:
    branches: ["main"]
    paths:
      - "packages/kilo-jetbrains/**"
      - ".github/workflows/codeql-kotlin.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/kilo-jetbrains/**"
      - ".github/workflows/codeql-kotlin.yml"
  schedule:
    - cron: "29 10 * * 5"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (java-kotlin)
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Kilo-Org/kilocode'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk space for CodeQL
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          docker system prune --all --force || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          # Leave headroom for the runner agent and OS. CodeQL otherwise claims ~14.6 GB of the
          # 16 GB runner, and the query phase OOM-kills the whole VM.
          ram: 12288

      - name: Build Java/Kotlin
        shell: bash
        run: ./gradlew typecheck --rerun-tasks --no-build-cache
        working-directory: packages/kilo-jetbrains
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The Gradle and Kotlin daemons stay resident for the rest of the job -- setup-gradle only
      # stops them in its post step, which runs after CodeQL. Their heap competes with query
      # evaluation and takes the runner down with it.
      - name: Stop Gradle and Kotlin daemons
        shell: bash
        working-directory: packages/kilo-jetbrains
        run: |
          ./gradlew --stop || echo "gradlew --stop failed; continuing"
          pkill -f KotlinCompileDaemon || echo "no Kotlin compile daemon to stop"
          sleep 5
          free -m
          ps -eo pid,rss,comm --sort=-rss | sed -n '1,15p'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
