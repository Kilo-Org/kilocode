# kilocode_change - new file
version: 2
updates:
  # Bun workspace root (packages/*). Version updates are OFF (limit 0): this
  # scan covers ~17 upstream-owned packages that share one bun.lock, and
  # Dependabot cannot scope a workspace scan by path. Nearly every PR it opened
  # touched upstream files and was closed by hand (dependabot-auto-merge.yml
  # skips them by design). Those dependencies come in with upstream merges.
  #
  # Alerts for this workspace do NOT come from this block. Dependabot has no
  # security updates for the bun ecosystem, and GitHub's dependency graph does
  # not parse bun.lock: on its own it only reads each package.json (direct
  # dependencies with a plain range, not `catalog:` ones), so transitive
  # dependencies never raised an alert. dependency-submission.yml submits the
  # resolved bun.lock to the dependency graph, which makes Dependabot alert on
  # every locked package under the `bun.lock` manifest, and
  # security-findings-notify.yml reports them. Alerts on bun.lock never get a
  # security update PR: fix them with a root `overrides` entry, a catalog pin
  # or a parent upgrade (`bun why <package>` shows who pulls it in). The
  # occasional security PR on a workspace package.json (an `npm_and_yarn`
  # branch) comes from the package.json-only alerts and also edits upstream
  # manifests, so check the resolved version in bun.lock before merging it.
  # The group below is kept in case GitHub adds bun security updates.
  # packages/kilo-docs has its own block below, since this scan can't see its
  # separate pnpm-lock.yaml.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # One PR for all security fixes in this scan, instead of one per alert.
    # Deliberately not named "*-minor-patch": these PRs are never auto-merged,
    # and this group has no update-types filter because a fix may need a major.
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # packages/kilo-docs deploys separately via pnpm; see note above.
  - package-ecosystem: "npm"
    directory: "/packages/kilo-docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(kilo-docs)"
    # Majors are never proposed. They can change peer specs or type targets
    # (for example the @types/node major, which no longer matched the Node
    # versions we target). Bump them by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Related packages move together. Group names must end in "-minor-patch"
    # so dependabot-auto-merge.yml recognises them. When a dependency matches
    # several groups, Dependabot puts it in the most specific one, not the
    # first one listed. A group with no `patterns` scores higher than any
    # wildcard pattern, so the catch-all group must declare `patterns: ["*"]`
    # (the lowest score). Without it, the catch-all takes every dependency
    # matched only by a wildcard, like "@vitest/*", away from its named group.
    groups:
      react-minor-patch:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      vitest-minor-patch:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
      kilo-docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/packages/kilo-jetbrains"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One slot per group below (6), so no group waits for another to merge.
    open-pull-requests-limit: 6
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(jetbrains)"
    # Majors are never proposed. They can change the build tooling or test
    # APIs (for example okhttp 4 -> 5 deprecates mockwebserver, and a Gradle
    # wrapper or Kotlin plugin major changes the build itself). Bump them by
    # hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # One bad update must not block the rest, and coupled artifacts must move
    # together (same "-minor-patch" suffix and specificity rules as above).
    groups:
      intellij-minor-patch:
        patterns:
          - "org.jetbrains.intellij.platform*"
          - "rpc"
        update-types:
          - "minor"
          - "patch"
      kotlin-minor-patch:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
        update-types:
          - "minor"
          - "patch"
      junit-minor-patch:
        patterns:
          - "junit*"
          - "org.junit*"
        update-types:
          - "minor"
          - "patch"
      okhttp-minor-patch:
        patterns:
          - "com.squareup.okhttp3*"
        update-types:
          - "minor"
          - "patch"
      markdown-minor-patch:
        patterns:
          - "org.commonmark*"
          - "org.nibor.autolink*"
        update-types:
          - "minor"
          - "patch"
      jetbrains-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

# GitHub does not detect Gradle dependencies statically, so JetBrains alerts
# come from the graph that dependency-submission.yml submits for
# packages/kilo-jetbrains. That submitted graph is also what lets Dependabot
# open security update PRs for direct Gradle dependencies; transitive ones
# are alert-only and fixed by hand.
#
# Deliberately not covered: docker (packages/opencode/Dockerfile) and
# github-actions (.github/workflows/**). Both paths are shared/upstream code
# with no "kilo" in their path, so dependabot-auto-merge.yml would never
# auto-merge them anyway, and .github/workflows/** changes routinely fail
# the repo's kilocode_change annotation check unless they happen to land
# inside an existing marker block. GitHub Actions are watched via Dependabot's
# native security alerts (the dependency graph reads workflow files) and
# security-findings-notify.yml. The Dockerfile has no alert coverage: the
# dependency graph does not read Dockerfiles.
