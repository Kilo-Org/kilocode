# kilocode_change - new file
version: 2
updates:
  # Bun workspace root (packages/*). Version updates are OFF (limit 0): this
  # scan covers ~17 upstream-owned packages that share one bun.lock, and
  # Dependabot cannot scope a workspace scan by path. Nearly every PR it opened
  # touched upstream files and was closed by hand (dependabot-auto-merge.yml
  # skips them by design). Those dependencies come in with upstream merges.
  # A limit of 0 does not disable security updates: alerts still open PRs, and
  # security-findings-notify.yml reports them. packages/kilo-docs has its own
  # block below, since this scan can't see its separate pnpm-lock.yaml.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"

  # packages/kilo-docs deploys separately via pnpm; see note above.
  - package-ecosystem: "npm"
    directory: "/packages/kilo-docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(kilo-docs)"
    # Majors are never proposed. They change peer/provider specs and break
    # typecheck (see the @ai-sdk/* 2.x -> 3.x and @types/node 24 -> 26 PRs).
    # Bump them by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Related packages move together. Group names must end in "-minor-patch"
    # so dependabot-auto-merge.yml recognises them. A dependency joins the
    # first group that matches it.
    groups:
      react-minor-patch:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      vitest-minor-patch:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
      kilo-docs-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/packages/kilo-jetbrains"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(jetbrains)"
    # Majors are never proposed. They change peer/provider specs and break
    # typecheck (see the @ai-sdk/* 2.x -> 3.x and @types/node 24 -> 26 PRs).
    # Bump them by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # One bad update must not block the rest, and coupled artifacts must move
    # together (same "-minor-patch" suffix and first-match rules as above).
    groups:
      intellij-minor-patch:
        patterns:
          - "org.jetbrains.intellij.platform*"
          - "rpc"
        update-types:
          - "minor"
          - "patch"
      kotlin-minor-patch:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
        update-types:
          - "minor"
          - "patch"
      junit-minor-patch:
        patterns:
          - "junit*"
          - "org.junit*"
        update-types:
          - "minor"
          - "patch"
      okhttp-minor-patch:
        patterns:
          - "com.squareup.okhttp3*"
        update-types:
          - "minor"
          - "patch"
      markdown-minor-patch:
        patterns:
          - "org.commonmark*"
          - "org.nibor.autolink*"
        update-types:
          - "minor"
          - "patch"
      jetbrains-minor-patch:
        update-types:
          - "minor"
          - "patch"

# Deliberately not covered: docker (packages/opencode/Dockerfile) and
# github-actions (.github/workflows/**). Both paths are shared/upstream code
# with no "kilo" in their path, so dependabot-auto-merge.yml would never
# auto-merge them anyway, and .github/workflows/** changes routinely fail
# the repo's kilocode_change annotation check unless they happen to land
# inside an existing marker block. Watch these via Dependabot's native
# security alerts (already repo-wide) and security-findings-notify.yml
# instead of proposing PRs that need manual handling either way.
